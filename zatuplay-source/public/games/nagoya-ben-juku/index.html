<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf5e9">
  <meta name="description" content="名古屋・尾張のことばを、10ジャンル・全150問の四択クイズで楽しもう。">
  <title>やっとかめ！名古屋弁塾</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'%3E%3Crect x='2' y='2' width='46' height='46' rx='14' fill='%23f49482'/%3E%3Cpath d='M25 8q2 15 17 17-15 2-17 17Q23 27 8 25 23 23 25 8' fill='%23251f39'/%3E%3C/svg%3E">
  <style>:root {
  --paper: #fbf5e9;
  --card: #fffdf8;
  --ink: #28213c;
  --muted: #655a71;
  --line: #e7ddcf;
  --pink: #f69787;
  --purple: #5a428a;
  --peach: #ffe8da;
  --mint: #e2f0d8;
  --lemon: #f8edbd;
  --lilac: #eee5fc;
  --rose: #fbe3ea;
  --sky: #e0edf9;
  --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif;
}
* { box-sizing: border-box; }
html { color-scheme: light; scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 280px;
  background: radial-gradient(#88683916 .65px, transparent .65px) var(--paper);
  background-size: 9px 9px;
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.6;
}
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 3px solid #7050b3; outline-offset: 4px; }
:focus:not(:focus-visible) { outline: none; }
h1, h2, h3, p { margin: 0; }
.page { width: min(1100px, calc(100% - 64px)); margin-inline: auto; }
.topbar { background: var(--paper); border-bottom: 1px solid #e9ddcc; }
.header-inner { min-height: 78px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand {
  display: inline-flex; align-items: center; gap: 11px; padding: 0; background: none; border: 0; text-align: left;
  font-size: 18px; font-weight: 900; line-height: 1.1; white-space: nowrap; letter-spacing: .07em;
}
.brand small { display: block; margin-top: 5px; font: 800 9px/1.2 "Avenir Next", system-ui, sans-serif; letter-spacing: .1em; }
.brand-mark {
  display: grid; place-items: center; width: 39px; height: 39px; border-radius: 12px;
  background: var(--pink); font: 26px/1 system-ui, sans-serif; border: 1.5px solid var(--ink);
  box-shadow: 1px 2px 0 var(--ink);
}
nav { display: flex; gap: 7px; }
.nav-button { border: none; background: transparent; border-radius: 40px; padding: 8px 15px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.nav-button[aria-current="page"], .nav-button:hover { background: #ede4d9; }
.main { min-height: 62vh; padding-top: 31px; padding-bottom: 48px; }
.hero {
  display: grid; grid-template-columns: 1.1fr .9fr; position: relative; isolation: isolate;
  overflow: hidden; border: 2px solid var(--ink); border-radius: 25px;
  background: var(--pink); box-shadow: 0 6px 0 var(--ink);
}
.hero-copy { padding: 34px 0 37px 43px; position: relative; z-index: 2; }
.eyebrow { display: inline-block; font-weight: 850; font-size: 12px; letter-spacing: .075em; }
.hero .eyebrow { background: var(--ink); color: #fff6ea; border-radius: 20px; padding: 4px 12px; }
.hero h1 { font-size: clamp(40px, 5.55vw, 76px); font-weight: 950; line-height: 1.1; margin: 15px 0 13px; letter-spacing: -.07em; }
.hero h1 small { display: block; font-size: .54em; letter-spacing: -.04em; margin-bottom: .1em; }
.hero p { font-size: 14px; font-weight: 750; margin-bottom: 20px; }
.hero-art { position: relative; display: grid; place-items: center; min-width: 0; }
.hero-art::before {
  content: ""; position: absolute; inset: 0 -12% 0 -18%; z-index: -1;
  background: repeating-conic-gradient(from 12deg at 58% 51%, #fff1db34 0deg 13deg, transparent 13deg 31deg);
  mask-image: linear-gradient(90deg, transparent, black 28%);
}
.hero-art img { width: min(92%, 410px); max-height: 296px; object-fit: contain; filter: drop-shadow(0 4px 0 #39253c18); }
.button {
  min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 8px 16px; border: 1.5px solid var(--ink); border-radius: 12px;
  background: var(--card); font-weight: 850; font-size: 14px; text-decoration: none; line-height: 1.35;
}
.button:hover { background: #ffefd7; }
.button.dark { color: #fffaf1; background: var(--ink); box-shadow: 0 3px 0 #17112155; }
.button.dark:hover { background: #483861; }
.button:active, .genre:hover { transform: translateY(2px); }
.button:disabled { opacity: .55; transform: none; }
.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 26px; }
.mode {
  display: grid; align-items: center; grid-template-columns: auto 1fr auto; gap: 13px; width: 100%;
  padding: 13px 16px; text-align: left; border: 1px solid var(--line); border-radius: 16px;
  background: var(--card); box-shadow: 0 2px 0 #d9cdb544;
}
.mode:hover:not(:disabled) { border-color: var(--purple); }
.mode:disabled { color: var(--muted); }
.mode-icon, .genre-icon {
  display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--lilac);
  font-size: 22px; line-height: 1;
}
.mode.review .mode-icon { background: var(--mint); }
.mode strong, .mode small { display: block; }
.mode strong { font-size: 15px; }
.mode small { color: var(--muted); font-size: 11px; font-weight: 650; margin-top: 1px; }
.arrow { font: 800 17px/1 system-ui, sans-serif; }
.genres-section { margin-top: 30px; scroll-margin-top: 16px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 14px; margin-bottom: 13px; }
.section-head h2 { font-size: clamp(24px, 3vw, 31px); line-height: 1.25; letter-spacing: -.045em; font-weight: 950; }
.section-head p { color: var(--muted); font-size: 12px; font-weight: 650; }
.marker { color: #805128; margin-right: 7px; }
.genres-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.genre {
  text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 15px;
  min-width: 0; display: block; width: 100%; padding: 12px; box-shadow: 0 3px 0 #d9cdb544;
  transition: transform 120ms, border-color 120ms;
}
.genre:hover { border-color: var(--purple); box-shadow: 0 1px 0 #d9cdb566; }
.genre-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.genre-icon { background: var(--genre-color); }
.genre-meta { color: var(--muted); font-size: 10px; font-weight: 750; white-space: nowrap; }
.genre-name { display: block; font-weight: 900; font-size: 14px; margin: 7px 0 8px; }
progress { width: 100%; height: 7px; display: block; border: 0; border-radius: 40px; overflow: hidden; background: #eee5d9; accent-color: var(--purple); }
progress::-webkit-progress-bar { background: #eee5d9; }
progress::-webkit-progress-value { background: var(--purple); border-radius: 40px; }
progress::-moz-progress-bar { background: var(--purple); border-radius: 40px; }
.narrow { width: min(710px, 100%); margin-inline: auto; }
.back { margin-bottom: 13px; padding: 4px 3px; border: 0; background: transparent; font-weight: 800; font-size: 13px; color: var(--purple); }
.back:hover { text-decoration: underline; }
.quiz-shell, .result-shell, .record-shell { padding: 24px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 #dfd2bf; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 24px; background: var(--lilac); padding: 4px 10px; font-size: 12px; font-weight: 850; }
.quiz-count { font-size: 13px; font-weight: 850; color: var(--muted); }
.prompt { margin: 20px 0 16px; }
.prompt p { font-size: 12px; font-weight: 800; color: var(--muted); }
.prompt h1 { margin-top: 4px; font-size: clamp(24px, 4vw, 36px); line-height: 1.35; overflow-wrap: anywhere; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.answer {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%;
  border-radius: 12px; border: 1.5px solid #ded3e5; background: #faf7ff; text-align: left;
  padding: 9px 11px; min-height: 55px; font-weight: 800; font-size: 14px; line-height: 1.4;
}
.answer:hover:not(:disabled) { border-color: var(--purple); background: var(--lilac); }
.answer-label { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #ede4fa; color: #513a80; font-weight: 900; }
.answer.correct { border-color: #407459; background: #e2f3e7; }
.answer.correct .answer-label { background: #cde8d5; color: #1e5936; }
.answer.incorrect { border-color: #ae543c; background: #fde7de; }
.answer.incorrect .answer-label { background: #ffd7cb; color: #86321f; }
.answer-check { min-width: 10px; }
.feedback { margin-top: 14px; border-radius: 14px; padding: 12px 15px; background: var(--mint); font-size: 14px; }
.feedback.miss { background: var(--peach); }
.feedback h2 { font-size: 19px; }
.feedback h2, .feedback .explanation { margin-bottom: 5px; }
.example { border-left: 2px solid #532b6680; padding-left: 10px; margin-top: 9px; overflow-wrap: anywhere; }
.example span { display: block; color: var(--muted); font-size: 12px; }
.quiz-foot { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.quiz-foot p { font-size: 12px; color: var(--muted); font-weight: 800; }
.results-title { font-weight: 950; font-size: clamp(25px, 4vw, 37px); margin-top: 9px; }
.score { margin: 12px 0; background: var(--lemon); padding: 13px 16px; border: 1px solid #e8d7a0; border-radius: 14px; }
.score strong { font-size: 40px; line-height: 1.05; letter-spacing: -.04em; }
.score span { font-weight: 850; }
.result-note { color: var(--muted); margin-bottom: 15px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.review-list { margin: 19px 0 0; border-top: 1px solid var(--line); padding-top: 12px; }
.review-list h2 { font-size: 17px; margin-bottom: 8px; }
.review-item { border-bottom: 1px solid var(--line); padding: 7px 0; }
.review-item summary { font-size: 13px; font-weight: 850; cursor: pointer; }
.review-item p { font-size: 13px; padding: 3px 0 3px 13px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 18px; }
.stat { background: var(--lilac); border-radius: 12px; padding: 10px; }
.stat:nth-child(2) { background: var(--mint); }
.stat:nth-child(3) { background: var(--peach); }
.stat strong { display: block; font-size: 23px; line-height: 1.25; }
.stat small { color: var(--muted); font-size: 11px; }
.record-row { display: grid; grid-template-columns: minmax(109px, auto) 1fr 43px; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; padding: 6px 0; }
.record-row span:last-child { text-align: right; color: var(--muted); }
.footer { border-top: 1px solid var(--line); padding: 12px 0 20px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
.footer b { color: var(--ink); }
.footer-divider { margin: 0 5px; }
.footer summary { text-align: right; cursor: pointer; }
.footer ul { margin: 4px 0; padding-inline-start: 20px; }
@media (max-width: 860px) { .genres-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 650px) {
  .page { width: calc(100% - 28px); }
  .header-inner { min-height: 63px; }
  .brand { font-size: 16px; gap: 7px; }
  .brand small { font-size: 7.5px; }
  .brand-mark { width: 32px; height: 32px; font-size: 20px; }
  .nav-button { padding: 7px 9px; font-size: 12px; }
  .main { padding: 16px 0 34px; }
  .hero { grid-template-columns: 1fr; border-radius: 19px; }
  .hero-copy { padding: 19px 17px 0; }
  .hero h1 { font-size: clamp(40px, 11vw, 65px); margin: 9px 0; }
  .hero p { margin-bottom: 12px; font-size: 13px; }
  .hero-art { margin-top: -28px; min-height: 126px; padding-top: 3px; }
  .hero-art::before { inset: -50px -12% 0; mask-image: linear-gradient(transparent, black 30%); }
  .hero-art img { width: 55%; height: clamp(126px, 32vw, 194px); margin-left: auto; margin-right: 5px; }
  .mode-row { gap: 8px; margin-top: 19px; }
  .mode { gap: 7px; padding: 10px 7px; grid-template-columns: auto 1fr; border-radius: 12px; min-height: 62px; }
  .mode .arrow { display: none; }
  .mode-icon { width: 32px; height: 32px; border-radius: 8px; font-size: 17px; }
  .mode strong { font-size: 12px; }
  .mode small { font-size: 10px; }
  .genres-section { margin-top: 22px; }
  .genres-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .genre { padding: 8px; border-radius: 11px; }
  .genre-icon { width: 32px; height: 32px; font-size: 17px; border-radius: 9px; }
  .genre-name { margin: 4px 0 7px; }
  .section-head p { font-size: 10px; white-space: nowrap; }
  .quiz-shell, .result-shell, .record-shell { padding: 15px; border-radius: 15px; }
  .answers { grid-template-columns: 1fr; }
  .answer { min-height: 46px; }
  .quiz-foot .button { min-width: 111px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}

.record-switch-status { margin: 0 0 14px; color: var(--muted); }
.record-switch-status:empty { display: none; }
.record-control { margin: 16px 0 0; }
.record-control p { margin: 6px 0; }
dialog { width: min(32rem, calc(100vw - 1.5rem)); max-height: 90dvh; padding: 22px; border: 0; border-radius: 15px; }
dialog::backdrop { background: #201e2fb5; }
dialog form { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
</style>
</head>

const questions = bank.flatMap((lines, genreIndex) =>

    const [term, answer, incorrect, note, example, translation] = line.split("|").map(part => part.trim());
    const genre = genres[genreIndex].id;
    return {
      id: `${genre}-${index + 1}`, genre, term, answer,
      options: [answer, ...incorrect.split("/")], note, example, translation
    };
  })
);

function freshState() { return { correct: {}, misses: {}, sessions: {}, tries: 0 }; }
function parseState(raw) {
  const x = JSON.parse(raw);

  if (!map(x)) throw Error("保存形式が正しくありません。");
  const next = { ...freshState(), ...x };
  for (const key of ["correct", "misses"]) {
    if (!map(next[key]) || Object.entries(next[key]).some(([id, mark]) => !byId.has(id) || mark !== true)) throw Error("学習記録が正しくありません。");
  }
  if (!Number.isSafeInteger(next.tries) || next.tries < 0 || !map(next.sessions)) throw Error("保存形式が正しくありません。");
  for (const [mode, session] of Object.entries(next.sessions)) {
    if (!groups.has(mode) && !["mixed", "review", "retry"].includes(mode)) throw Error("セッションが正しくありません。");
    if (!map(session) || !Array.isArray(session.ids) || !session.ids.length || session.ids.length > libraryCount ||
        !session.ids.every(id => byId.has(id)) || new Set(session.ids).size !== session.ids.length ||
        !Number.isInteger(session.index) || session.index < 0 || session.index >= session.ids.length ||

        !session.answers.every(n => Number.isInteger(n) && n >= 0 && n < 4) ||

  }

}

    document.querySelector("#save-dialog-text").textContent = restoring ? "現在の学習記録と、保管した記録を入れ替えます。" :

    document.querySelector("#save-dialog-confirm").textContent = restoring ? "切り替える" : "リセットする";
    saveDialog.showModal();
  } catch (error) { setStatus(error.message); }
}
saveDialog.addEventListener("close", () => { pendingRecordSwitch = null; });
document.querySelector("#save-dialog-confirm").addEventListener("click", () => {
  if (!pendingRecordSwitch || !saveDialog.open || guard) return;
  const { expected, expectedBackup, restoring } = pendingRecordSwitch;
  try {
    const { raw, target } = switchRecord(localStorage, expected, expectedBackup, restoring);
    state = target; baseline = raw; currentMode = null; results = null;
    saveDialog.close();
    navigate("record", renderRecord);
    setStatus(restoring ? "保管していた学習記録に切り替えました。" : "学習記録を初期状態に戻しました。保管した記録から復元できます。");
  } catch (error) {
    saveDialog.close();
    setStatus("学習記録を変更できませんでした。現在の記録は保持されています。");
  }
});
window.addEventListener("storage", event => {
  if (event.key !== storageKey && event.key !== backupKey && event.key !== null) return;
  if (event.key !== backupKey && (event.key === null || event.newValue !== baseline)) {
    guard = true;
    setStatus("別の画面で記録が変わりました。上書きせず保護しています。続けるには再読み込みしてください。");
    if (saveDialog.open) saveDialog.close();
  }
  if (view === "record") renderRecord();
});

function safe(text) {
  return String(text).replace(/[&<>"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[character]);
}

function shuffle(values) {
  const copy = [...values];
  for (let position = copy.length - 1; position > 0; position--) {
    const swap = Math.floor(Math.random() * (position + 1));
    [copy[position], copy[swap]] = [copy[swap], copy[position]];
  }
  return copy;
}

function remaining() {
  return Object.keys(state.misses).filter(id => byId.has(id));
}

function mastered(group = questions) {
  return group.filter(question => state.correct[question.id]).length;
}

function allCorrect() { return mastered() === libraryCount; }

}

function nameFor(mode) {
  return genres.find(genre => genre.id === mode)?.name ?? {
    mixed: "まぜこぜ15問", review: "まちがい復習", retry: "この回の復習"
  }[mode];
}

function progress(value, max, label) {
  return `<progress value="${value}" max="${max}" aria-label="${safe(label)}"></progress>`;
}

function navigate(next, render) {
  view = next;
  document.querySelectorAll(".nav-button").forEach(button => {
    if (button.dataset.action === next) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  });
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
  screen.querySelector("h1")?.focus({ preventScroll: true });
}

function renderRecord() {
  const done = mastered();
  const reviewMode = state.sessions.retry ? "retry" : "review";
  const reviewActive = Boolean(state.sessions[reviewMode]);
  const count = remaining().length;
  const complete = genres.filter(genre => {
    const group = groups.get(genre.id);
    return mastered(group) === group.length;
  }).length;
  screen.innerHTML = `
    <section class="narrow record-shell">
      <h1 class="results-title" tabindex="-1">学習記録</h1>
      <div class="stats">
        <div class="stat"><strong>${done} / ${libraryCount}</strong><small>正解した問題</small></div>
        <div class="stat"><strong>${complete} / ${genres.length}</strong><small>全問正解したジャンル</small></div>
        <div class="stat"><strong>${state.tries} 回</strong><small>答えた回数</small></div>
      </div>
      ${genres.map(genre => {
        const group = groups.get(genre.id);
        const count = mastered(group);
        return `<div class="record-row">
          <span><span aria-hidden="true">${genre.icon}</span> ${genre.name}</span>
          ${progress(count, group.length, `${genre.name}の正解済み問題`)}
          <span>${count}/${group.length}</span>
        </div>`;
      }).join("")}
      <div class="actions review-list">
        <button class="button dark" data-action="start" data-mode="${reviewMode}" ${count || reviewActive ? "" : "disabled"}>${reviewActive ? "復習をつづける" : `まちがい復習（${count}問）`}</button>
        <button class="button" data-action="home">ホームへ</button>
      </div>
      <section aria-label="記録の管理" class="record-control">
        <h2>記録の管理</h2>
        <p>同じブラウザに保存します。Android版・別サイトとは自動で同期しません。</p>
        <div class="actions">
          ${allCorrect() ? '<button class="button dark" data-action="ending">全問制覇のエンディング</button>' : ""}
          <button class="button" data-action="reset" ${guard || baseline === null ? "disabled" : ""}>学習記録をリセット</button>
          <button class="button" data-action="restore" ${guard || baseline === null || !backedUp() ? "disabled" : ""}>保管した記録に切り替える</button>
        </div>
      </section>
    </section>`;
}

function start(mode, selectedIds) {
  let session = state.sessions[mode];
  if (!session || selectedIds) {
    let ids = selectedIds;
    if (!ids && mode === "mixed") ids = shuffle(questions).slice(0, 15).map(question => question.id);
    if (!ids && mode === "review") ids = shuffle(remaining());
    if (!ids && groups.has(mode)) ids = groups.get(mode).map(question => question.id);
    if (!ids?.length) return;
    session = { ids, index: 0, answers: [], streak: 0, maxStreak: 0, order: shuffle([0, 1, 2, 3]) };
    state.sessions[mode] = session;
    save();
  }
  currentMode = mode;
  navigate("quiz", renderQuiz);
}

function renderQuiz() {
  const session = state.sessions[currentMode];
  const question = byId.get(session.ids[session.index]);
  const number = session.index + 1;
  const answered = session.answers.length === number;
  const selected = session.answers[session.index];
  const correct = selected === 0;
  const genre = genres.find(item => item.id === question.genre);
  const term = genre.id === "dialogue" ? question.term : `「${question.term}」`;
  screen.innerHTML = `
    <section class="narrow">
      <button class="back" data-action="home">← ホームへ</button>
      <div class="quiz-shell">
        <div class="quiz-top"><span class="badge"><span aria-hidden="true">${genre.icon}</span> ${nameFor(currentMode)}</span><span class="quiz-count">第 ${number} 問 / ${session.ids.length}</span></div>
        ${progress(session.answers.length, session.ids.length, "今回の回答済み問題")}
        <div class="prompt">
          <p>${genre.id === "dialogue" ? "共通語にすると？" : "どんな意味・使い方？"}</p>
          <h1 tabindex="-1">${safe(term)}</h1>
        </div>
        <div class="answers" aria-label="答えの選択肢">
          ${session.order.map((option, index) => {
            const mark = answered && option === 0 ? "correct" : answered && option === selected ? "incorrect" : "";
            const label = mark === "correct" ? "正解" : mark === "incorrect" ? "選んだ答え、不正解" : null;
            return `<button class="answer ${mark}" data-action="answer" data-option="${option}" ${answered ? "disabled" : ""}
              ${label ? `aria-label="${safe(question.options[option])}、${label}"` : ""}>
              <span class="answer-label" aria-hidden="true">${alphabet[index]}</span>
              <span>${safe(question.options[option])}</span>
              <span class="answer-check" aria-hidden="true">${mark === "correct" ? "✓" : mark === "incorrect" ? "×" : ""}</span>
            </button>`;
          }).join("")}
        </div>
        ${answered ? `<div class="feedback ${correct ? "" : "miss"}">
          <h2 id="feedback-title" tabindex="-1">${correct ? "◎ 正解だがね！" : "△ おしい！"}</h2>
          <p><b>正解　${safe(question.answer)}</b></p>
          <p class="explanation">${safe(question.note)}</p>
          <p class="example"><b>${safe(question.example)}</b><span>${safe(question.translation)}</span></p>
        </div>
        <div class="quiz-foot">
          <p>${session.streak > 1 ? `✦ ${session.streak}問連続正解` : ""}</p>
          <button class="button dark" data-action="next">${number === session.ids.length ? "結果を見る" : "次の問題"} →</button>
        </div>` : ""}
      </div>
    </section>`;
}

function answer(option) {
  const session = state.sessions[currentMode];
  if (!session || session.answers.length !== session.index || !session.order.includes(option)) return;
  const id = session.ids[session.index];
  session.answers.push(option);
  state.tries++;
  if (option === 0) {
    state.correct[id] = true;
    delete state.misses[id];
    session.streak++;
    session.maxStreak = Math.max(session.maxStreak, session.streak);
  } else {
    state.misses[id] = true;
    session.streak = 0;
  }
  save();
  renderQuiz();
  screen.querySelector("#feedback-title").focus();
}

function nextQuestion() {
  const session = state.sessions[currentMode];
  if (!session || session.answers.length !== session.index + 1) return;
  if (session.index + 1 < session.ids.length) {
    session.index++;
    session.order = shuffle([0, 1, 2, 3]);
    save();
    navigate("quiz", renderQuiz);
    return;
  }
  results = { ...session, mode: currentMode };
  delete state.sessions[currentMode];
  save();
  navigate("results", renderResults);
}

function renderResults() {
  const { ids, answers, mode, maxStreak } = results;
  const count = answers.filter(option => option === 0).length;
  const perfect = count === ids.length;
  const incorrect = ids.filter((_, index) => answers[index] !== 0);
  screen.innerHTML = `
    <section class="narrow result-shell">
      <span class="badge">${nameFor(mode)}</span>
      <h1 class="results-title" tabindex="-1">${perfect ? "全問正解！ でらすごいがね！" : "答え合わせできたがね！"}</h1>
      <p class="score"><strong>${count}</strong> <span>/ ${ids.length} 問正解</span></p>
      <p class="result-note">${maxStreak > 1 ? `最高 ${maxStreak} 問連続正解。 ` : ""}${perfect ? "次のジャンルにも挑戦してみやあ。" : "気になったことばは、もういっぺん見てみやあ。"}</p>
      <div class="actions">
        ${allCorrect() ? '<button class="button dark" data-action="ending">全問制覇のエンディング</button>' : ""}
        ${incorrect.length ? '<button class="button dark" data-action="retry-misses">この回のまちがいを復習</button>' : ""}
        ${groups.has(mode) || mode === "mixed" ? `<button class="button" data-action="start" data-mode="${mode}">もう一度挑戦</button>` : ""}
        <button class="button ${perfect ? "dark" : ""}" data-action="home">ホームへ</button>
      </div>
      ${incorrect.length ? `<div class="review-list"><h2>まちがえたことば</h2>${incorrect.map(id => {
        const question = byId.get(id);
        return `<details class="review-item"><summary>${safe(question.term)}</summary>
          <p><b>${safe(question.answer)}</b>　${safe(question.note)}</p>
          <p>${safe(question.example)}<br>${safe(question.translation)}</p>
        </details>`;
      }).join("")}</div>` : ""}
    </section>`;
}

document.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;
  switch (button.dataset.action) {
    case "home": navigate("home", renderHome); break;
    case "record": navigate("record", renderRecord); break;
    case "ending": if (allCorrect()) navigate("ending", renderEnding); break;
    case "reset": if (view === "record") promptRecords(false); break;
    case "restore": if (view === "record") promptRecords(true); break;
    case "start": start(button.dataset.mode); break;
    case "answer": answer(Number(button.dataset.option)); break;
    case "next": nextQuestion(); break;
    case "retry-misses": start("retry", results.ids.filter((_, index) => results.answers[index] !== 0)); break;
  }
});

document.addEventListener("keydown", event => {
  if (saveDialog.open || view !== "quiz" || event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
  if (/^[1-4]$/.test(event.key)) {
    screen.querySelectorAll(".answer")[Number(event.key) - 1]?.click();
  }
});

renderHome();

</script>
</body>
</html>
