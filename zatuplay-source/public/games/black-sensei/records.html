<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ブラック先生 · 記録と結末</title><style>body{font:17px/1.8 system-ui;margin:0;background:#faf6ef;color:#292332}main{max-width:680px;margin:24px auto;padding:20px}button,input,a{font:inherit;margin:6px;padding:8px}#black-save-panel button{white-space:normal}section{padding:16px}button{max-width:100%}</style><body data-records="true"><main><h1>ブラック先生 · 記録と結末</h1><a href="./">ゲームへ戻る</a><p>APKとは別の、このブラウザ版だけの記録です。再鑑賞で報酬や記録は変わりません。同じ作品のほかのタブを閉じてから開いてください。</p><p id="ending-locked">最終面50-5をクリアすると結末の文章を読み返せます。最終面の解放だけでは表示されません。</p><section id="ending" hidden><h2>結末をもう一度</h2><p>街に朝が来た。守り抜いた帰り道の先で、生徒たちが待っている。「さあ、授業を始めるぞ。」</p><p>この結末の後も、ゲームへ戻って再挑戦できます。</p></section></main><script defer src="save-guard.js?v=candidate-2"></script></body></html>
