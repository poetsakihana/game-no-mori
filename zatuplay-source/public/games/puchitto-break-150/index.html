<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="description" content="プチプチ、紙めくり、音あそび。日常の気持ちいい動きを集めた150のミニゲーム。">
  <title>ぷちっと休憩</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/catalog.js?v=1.0.0-web.2" defer></script>
  <script src="assets/play.js?v=1.0.0-web.2" defer></script>
  <script src="assets/storage.js" defer></script>
</head>
<body>
<p role="note" style="margin:12px;padding:12px;border:1px solid #c98a16;background:#fff6d8;color:#332600;font:14px/1.6 sans-serif">試験公開版：自動テストは通過していますが、実ブラウザ操作・スマホ実機・音の実聴取は未検証です。</p>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" id="brand" aria-label="ぷちっと休憩 ホーム">
        <img src="assets/icon.png" alt="" width="36" height="36">
        <span>ぷちっと休憩</span>
      </a>
      <div class="header-right">
        <div class="progress-pill" id="progress" aria-label="クリア数"></div>
        <button id="sound-switch" type="button" class="outline small" aria-pressed="true">♪ <span>音あり</span></button>
      </div>
    </div>
  </header>
  <main class="page">
    <aside class="web-tools" aria-label="ブラウザ版の保存">
      <a href="../../browser/">← ZatuPlayの一覧</a>
      <p>ブラウザ版：クリア記録・お気に入り・音設定をこのブラウザに保存します。各遊びの途中は保存しません。APK・以前のChatGPT Site版とは別保存で、記録は自動で引き継がれません。元の音源は使わず合成音で遊べます。糸電話とバス案内は端末の日本語読み上げを使います（マイク不要）。音OFF・読み上げ非対応時は字幕で遊べます。</p>
      <button id="backup" type="button">記録を書き出す</button>
      <label>記録を復元 <input id="restore" type="file" accept="application/json,.json"></label>
      <p id="save-status" role="status">保存を確認しています…</p>
    </aside>
    <div id="lobby">
      <section class="hero" aria-labelledby="home-title">
        <div class="hero-image" aria-hidden="true"></div>
        <div class="hero-copy">
          <h1 id="home-title">ひと息、<br>ぷちっと。</h1>
          <p>つぶす、はがす、そろえる。<br>指先で楽しむ150のミニゲーム。</p>
          <div class="hero-actions">
            <button id="featured" type="button" class="primary"><span aria-hidden="true" class="play-triangle"></span> プチプチで遊ぶ</button>
            <button id="random" type="button" class="secondary">おまかせ <span aria-hidden="true">↗</span></button>
          </div>
        </div>
      </section>
      <section class="library" id="library" aria-labelledby="library-title">
        <div class="library-head">
          <h2 id="library-title">あそびを選ぶ</h2>
          <label class="search">
            <span aria-hidden="true" class="search-icon"></span>
            <input id="search" type="search" placeholder="名前や動きで探す" aria-label="名前や動きで探す">
          </label>
        </div>
        <nav id="categories" class="categories" aria-label="ジャンル"></nav>
        <div class="catalog-bar">
          <p id="count" aria-live="polite"></p>
          <button type="button" id="favorites" class="outline small" aria-pressed="false"><span aria-hidden="true">♡</span> お気に入り</button>
        </div>
        <div id="cards" class="card-grid"></div>
        <button id="more" type="button" class="outline more">さらに表示 <span aria-hidden="true">↓</span></button>
      </section>
    </div>
    <section id="play" class="play-page" aria-labelledby="game-title" hidden>
      <div class="game-navigation">
        <button type="button" id="back" class="outline small">← 一覧に戻る</button>
        <span id="genre"></span>
        <button type="button" id="favorite" class="outline icon-button" aria-label="お気に入りに追加" aria-pressed="false">♡</button>
      </div>
      <h1 id="game-title" tabindex="-1"></h1>
      <p id="game-help"></p>
      <div id="game-box" class="game-box">
        <canvas id="surface" width="720" height="420" tabindex="0" aria-label="指かマウスで遊ぶゲーム画面"></canvas>
        <div class="play-panel">
          <div id="game-controls" class="game-controls" aria-label="ゲームの操作"></div>
          <div class="meter-strip" aria-hidden="true"><span id="game-meter"></span></div>
          <p id="game-status" role="status" aria-live="polite"></p>
        </div>
      </div>
      <div class="play-footer">
        <button type="button" id="restart" class="outline">もう一回</button>
        <button type="button" id="next" class="secondary">次のあそび <span aria-hidden="true">→</span></button>
      </div>
    </section>
  </main>
</body>
</html>
