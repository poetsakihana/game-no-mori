<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c131b"><title>DoragonOut — ゲーム</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080f16;color:#e6dfcd;font-family:system-ui;touch-action:none}#layout{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 14px env(safe-area-inset-bottom)}#screen{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;position:relative}#canvas{display:block;background:#000;outline:0;width:min(100%,calc((100dvh - 235px)*1.3333));height:auto;max-height:100%;aspect-ratio:4/3;image-rendering:pixelated;object-fit:contain;box-shadow:0 0 0 1px #45535c,0 0 40px #0008}#status{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:#dabc80;pointer-events:none}#controls{display:flex;justify-content:space-between;align-items:center;width:min(100%,600px);height:190px;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,50px);gap:3px}button{min-width:46px;min-height:46px;border:1px solid #3c515e;color:#e4d2ad;background:linear-gradient(#293d4a,#172934);border-radius:12px;font:18px system-ui;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}button:active,button.pressed{background:#5b6f73;border-color:#dabc80;transform:scale(.96)}.dpad button:nth-child(1){grid-area:1/2}.dpad button:nth-child(2){grid-area:2/1}.dpad button:nth-child(3){grid-area:2/3}.dpad button:nth-child(4){grid-area:3/2}.center{grid-area:2/2;display:grid;place-items:center;color:#637985}.actions{position:relative;width:150px;height:130px}.actions button{position:absolute;width:64px;height:64px;border-radius:50%;font:24px Georgia}.actions #a{right:0;top:0;color:#172029;background:#dabc80;border-color:#ead4a8}.actions #b{left:0;bottom:0}.actions small{position:absolute;font-size:9px;letter-spacing:.1em;color:#99a8af;right:7px;top:69px}.actions small:last-child{left:20px;top:auto;bottom:-15px}.utility{display:flex;gap:10px;align-items:center;justify-content:center;min-height:38px;width:100%}.utility button{font-size:10px;min-height:30px;min-width:50px;padding:5px 10px;border-radius:5px;background:transparent}.utility span{font-size:10px;color:#8296a0}#start-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080f16dd;z-index:2}#start-overlay button{padding:17px 25px;border-color:#dabc80;font-size:14px}.error{padding:30px;line-height:1.9}#save-indicator{font-size:10px;color:#9dc6af}@media(min-aspect-ratio:13/10){#layout{padding:10px 12px;display:grid;grid-template-columns:165px 1fr 150px;grid-template-rows:1fr 35px;gap:8px}#screen{grid-column:2;grid-row:1;height:100%}#canvas{width:min(100%,calc((100dvh - 65px)*1.3333));max-height:calc(100dvh - 65px)}#controls{display:contents}.dpad{grid-column:1;grid-row:1;align-self:center}.actions{grid-column:3;grid-row:1;align-self:center}.utility{grid-column:1/4;grid-row:2}}@media(max-width:360px){.dpad{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(3,45px)}.actions{width:130px}.actions button{width:57px;height:57px}}
</style><script src="browser-lifecycle.js"></script><link rel="stylesheet" href="browser.css"></head><body><div id="layout"><div id="screen"><canvas id="canvas" tabindex="0" width="320" height="240" aria-label="DoragonOutのゲーム画面"></canvas><div id="status"></div><div id="start-overlay"><button id="start">タップして冒険を再開</button></div></div><div id="controls"><div class="dpad"><button data-key="ArrowUp" aria-label="上へ">↑</button><button data-key="ArrowLeft" aria-label="左へ">←</button><button data-key="ArrowRight" aria-label="右へ">→</button><button data-key="ArrowDown" aria-label="下へ">↓</button><span class="center">◇</span></div><div class="actions"><button id="a" data-key="Enter" aria-label="決定・話す">A</button><small>決定・話す</small><button id="b" data-key="Escape" aria-label="戻る・メニュー">B</button><small>戻る</small></div></div><div class="utility"><button id="fullscreen">全画面</button><button data-key="ShiftLeft" aria-label="補助キー">SHIFT</button><span id="save-indicator">ゲーム内メニューからセーブ</span></div></div><script type="module" src="play.js"></script></body></html>
