.wallet-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.wallet-chip > .icon { color: #757bab; width: 18px; height: 18px; }
.wallet-chip + .wallet-chip { border-left: 1px solid var(--line); padding-left: 9px; }
.wallet-pill > .wallet-chip > span:last-child { max-width: 105px; overflow: hidden; text-overflow: ellipsis; }
.room-topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.role-label { display: inline-flex; gap: 6px; align-items: center; color: var(--green); font-size: 11px; font-weight: 700; }
.role-label .icon { width: 15px; height: 15px; }
.room-salary .gift-header strong { display: flex; gap: 6px; align-items: center; }
.room-salary .gift-header .icon { width: 17px; height: 17px; color: #757bab; }
.economy-metrics .metric .value { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.salary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.salary-grid > div { padding: 10px; border-radius: 10px; background: #ffffff91; }
.room-salary .salary-grid > div { background: #f3f4f8; }
.salary-grid > div > span { display: block; color: #626984; font-size: 10px; line-height: 1.7; margin-bottom: 5px; }
.salary-grid strong { display: block; font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rank-page-badge { width: 56px; height: 62px; font-size: 23px; flex-shrink: 0; }
.rank-dialog-badge { margin: 18px auto; }
.rank-overview { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 22px; }
.rank-overview span { display: block; font-size: 11px; color: #68776d; }
.rank-overview strong, .rank-overview strong span { display: inline; font-size: 17px; color: var(--text); font-weight: 700; }
.rank-overview strong { display: block; margin-top: 8px; overflow-wrap: anywhere; }
.wage-table th:not(:first-child), .wage-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
.wallet-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 17px; margin-bottom: 18px; }
.diamond-panel { background: #f0f0f9; border-color: #e7e8f2; }
.points-panel { background: #f8f3e7; border-color: #f0ebdb; }
.diamond-panel h2, .points-panel h2, .exchange-panel h2 { font-size: 14px; }
.diamond-amount { display: flex; align-items: center; gap: 12px; margin: 15px 0; font-size: clamp(25px, 4vw, 42px); font-weight: 700; overflow-wrap: anywhere; }
.diamond-amount > .icon { width: 31px; height: 31px; color: #737ab4; }
.diamond-amount small { font-size: 15px; color: #8b8068; }
.exchange-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; align-items: end; gap: 13px; }
.exchange-form .btn { min-height: 43px; }
.exchange-form .field-label { margin-top: 10px; }
.exchange-amount { display: flex; gap: 7px; }
.exchange-amount input { min-width: 0; }
.exchange-amount .btn { flex-shrink: 0; }
.exchange-panel #exchange-preview { min-height: 20px; margin-bottom: 0; }
.chat-message .message-main { min-width: 0; }
.reply-btn { display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 4px 9px 4px 0; color: #52836e; font-size: 10px; }
.reply-btn .icon { width: 13px; height: 13px; }
.reply-btn:hover { color: var(--green); text-decoration: underline; }
.reply-quote { border-left: 2px solid #a8cbbb; margin: 5px 0; padding: 4px 0 4px 8px; color: #66796d; font-size: 10px; line-height: 1.6; overflow-wrap: anywhere; }
.reply-context { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #edf5ef; border-top: 1px solid #e1ebe1; }
.reply-context[hidden] { display: none; }
.reply-target { min-width: 0; font-size: 11px; color: #486b57; }
.reply-target span { display: block; color: #697d6e; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; margin-top: 3px; }
.reply-clear { display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; }
.reply-clear:hover { background: #d9e8db; }
.reply-clear .icon { width: 16px; height: 16px; }
.chat-form input { font-size: 13px; }
.mobile-chat-jump { display: none; }

@media (max-width: 760px) {
  .wallet-grid { grid-template-columns: 1fr; }
  .exchange-form { grid-template-columns: 1fr 1fr; }
  .exchange-form > .btn { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .top-right .search-wrap { flex: 1; min-width: 0; }
  .top-right .search-wrap input { width: 100%; max-width: 174px; }
  .wallet-pill { gap: 6px; padding: 0; }
  .wallet-chip + .wallet-chip { padding-left: 6px; }
  .wallet-chip > .icon { width: 15px; height: 15px; }
  .wallet-chip .coin { width: 19px; height: 19px; font-size: 8px; }
  .wallet-pill > .wallet-chip > span:last-child { max-width: 54px; }
  .salary-grid > div { padding: 8px 6px; }
  .salary-grid > div > span { font-size: 9px; }
  .salary-grid strong { font-size: 11px; }
  .rank-overview { gap: 10px; }
  .rank-overview strong, .rank-overview strong span { font-size: 13px; }
  .wage-table td, .wage-table th { padding-left: 9px; padding-right: 9px; }
  .economy-metrics .metric .value { font-size: 14px; }
  .exchange-form { grid-template-columns: minmax(0, 1fr); gap: 9px; }
  .exchange-form .field-label { margin-top: 8px; }
  .room-topline .role-label { font-size: 9px; }
  .mobile-chat-jump { display: inline-flex; }
  .chat-form input { font-size: 16px; }
  .chat-panel { scroll-margin-top: 12px; }
}

/* A portrait live room on phones, with a dedicated chat column on wider screens. */
.live-page {
  overflow: hidden;
  background: #172624;
}
.live-shell {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 22px;
  background: radial-gradient(ellipse at 20% 12%, #35443d, #172624 66%);
}
.live-content {
  width: min(100%, 1120px);
}
.live-room {
  --live-ink: #f7f9f7;
  --live-dim: #c0d2cc;
  --live-accent: #96ead1;
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(325px, .94fr);
  height: min(860px, calc(var(--live-height, 100dvh) - 44px));
  min-height: 0;
  isolation: isolate;
  overflow: hidden;
  border: 1px solid #ffffff18;
  border-radius: 28px;
  color: var(--live-ink);
  background: #1a2b29;
  box-shadow: 0 28px 84px #0b171767;
}
.live-stage {
  position: relative;
  display: flex;
  min-height: 0;
  min-width: 0;
}
.live-art, .live-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.live-art {
  background: var(--live-room-color, #334340);
  overflow: hidden;
}
.live-art .scene {
  width: 100%;
  height: 100%;
}
.live-shade {
  background: linear-gradient(180deg, #162723e8 0%, #1627239e 16%, transparent 41%, #12222124 67%, #0f201fe8 100%);
}
.live-stage-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  min-height: 0;
  padding: 22px;
}
.live-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.live-host {
  display: flex;
  gap: 9px;
  align-items: center;
  min-width: 0;
  padding: 3px 9px 3px 3px;
  border: 0;
  border-radius: 22px;
  color: var(--live-ink);
  background: #13242065;
  text-align: left;
}
.live-host .avatar {
  width: 40px;
  height: 40px;
  border: 1.5px solid #ffffffd0;
  box-shadow: 0 0 0 2px #ffffff12;
}
.live-host-copy {
  min-width: 0;
  display: grid;
  gap: 3px;
}
.live-host-copy strong, .live-host-copy small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.live-host-copy strong {font-size: 15px; line-height: 1.2;}
.live-host-copy small {font-size: 9px; color: #e2ece8;}
.live-header-buttons {
  display: flex;
  gap: 7px;
  margin-left: auto;
}
.live-icon-btn, .live-follow, .live-status-chip, .live-action, .live-quick-btn, .live-send {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
  color: var(--live-ink);
  border: 0;
}
.live-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #16262284;
}
.live-icon-btn:hover {background: #132420ba;}
.live-icon-btn .icon {width: 19px; height: 19px;}
.live-follow {
  min-height: 35px;
  gap: 4px;
  border-radius: 20px;
  padding: 0 10px;
  background: var(--live-accent);
  color: #16372d;
  font-size: 11px;
  font-weight: 750;
  white-space: nowrap;
}
.live-follow[aria-pressed="true"] {
  color: #e8f4ef;
  background: #1d3a31c4;
}
.live-follow .icon {width: 13px; height: 13px;}
.live-status {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  margin-top: 15px;
}
.live-onair {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 8px;
  padding: 5px 8px;
  color: white;
  background: #c83858;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .075em;
}
.live-onair i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 2px #ffffff4d;
}
.live-status-chip {
  min-height: 28px;
  gap: 4px;
  padding: 0 8px;
  border-radius: 18px;
  background: #17282490;
  font-size: 10px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.live-status-chip .icon {width: 13px; height: 13px;}
.live-status-chip.live-wage {color: #e7dcff;}
.live-heading {
  margin-top: 13px;
  text-shadow: 0 2px 14px #182924c9;
}
.live-heading h1 {
  font-size: clamp(17px, 2.1vw, 26px);
  font-weight: 750;
  line-height: 1.45;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.live-category {
  display: inline-block;
  margin-top: 5px;
  font-size: 10px;
  color: #f0f6f3;
}
.live-caption {
  display: grid;
  gap: 4px;
  align-self: flex-start;
  max-width: 100%;
  margin-top: auto;
  padding: 10px 14px;
  border: 1px solid #ffffff2b;
  border-radius: 14px;
  color: var(--live-ink);
  background: #162622ba;
  backdrop-filter: blur(8px);
  text-align: left;
}
.live-caption-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: #b9ead8;
  font-weight: 700;
}
.live-caption-label .icon {width: 12px; height: 12px;}
#reading-caption {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.live-conversation {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  border-left: 1px solid #ffffff14;
  background: linear-gradient(180deg, #233633, #192b29 65%);
}
.live-chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 10px;
  min-height: 56px;
  padding: 0 18px;
  border-bottom: 1px solid #ffffff14;
}
.live-chat-header h2 {font-size: 14px; font-weight: 750;}
.live-like-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #ffc6d6;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.live-like-count .icon {width: 15px; height: 15px;}
.live-chat-window {
  position: relative;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.live-chat-window .chat-log {
  flex: 1;
  min-height: 0;
  padding: 8px 16px;
  overflow: auto;
  scroll-behavior: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #ffffff34 transparent;
}
.live-chat-window .chat-message {
  position: relative;
  gap: 8px;
  padding: 7px 0;
  border-color: #ffffff12;
  color: var(--live-ink);
}
.live-chat-window .chat-message.system {
  padding: 5px 0;
  color: var(--live-dim);
  font-size: 10px;
}
.live-chat-window .chat-message .avatar,
.live-chat-window .listener-avatar {width: 25px; height: 25px;}
.live-chat-window .message-main {position: relative; flex: 1; min-width: 0;}
.live-chat-window .message-main:has(.reply-btn) {padding-right: 42px;}
.live-chat-window .message-name {color: #a9e7d2; font-size: 10px; font-weight: 750; margin: 0 0 3px;}
.live-chat-window .message-name .badge {color: #e3f1eb; background: #ffffff17;}
.live-chat-window .message-body {color: var(--live-ink); font-size: 12px; line-height: 1.55;}
.live-chat-window .chat-message.gift .message-body {color: #ffe1aa;}
.live-chat-window .reply-btn {
  position: absolute;
  top: 0;
  right: 0;
  padding: 4px 0 4px 4px;
  min-height: 29px;
  color: #c4e2d7;
  font-size: 9px;
}
.live-chat-window .reply-btn:hover {color: #fff;}
.live-chat-window .reply-quote {color: #c6e0d7; border-color: #8fcdb8;}
.live-chat-latest {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 11px;
  border: 1px solid #b5dfcf47;
  border-radius: 18px;
  background: #1f3a32;
  color: #dff4e9;
  white-space: nowrap;
  font-size: 10px;
}
.live-chat-latest .icon {width: 12px; height: 12px;}
.live-chat-latest[hidden] {display: none;}
.live-conversation .reply-context {background: #2a403b; border-top-color: #ffffff18; flex-shrink: 0;}
.live-conversation .reply-target {color: #d4f5e8;}
.live-conversation .reply-target span {color: #c0d2cc;}
.live-conversation .reply-clear {color: var(--live-ink);}
.live-conversation .reply-clear:hover {background: #ffffff17;}
.live-composer {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
  padding: 12px 14px;
  border-top: 1px solid #ffffff18;
  background: #152825;
}
.live-chat-form {
  display: flex;
  flex: 1;
  align-items: center;
  min-width: 0;
  height: 46px;
  padding: 0 5px 0 4px;
  border: 1px solid #ffffff26;
  border-radius: 24px;
  background: #ffffff14;
}
.live-chat-form input {
  flex: 1;
  width: 0;
  min-width: 0;
  border: 0;
  outline: none;
  padding: 0 3px;
  color: #fff;
  background: transparent;
  font-size: 16px;
}
.live-chat-form input::placeholder {color: #cbddd6; font-size: 13px;}
.live-chat-form:focus-within {border-color: #a0e3cf;}
.live-quick-btn, .live-send {width: 34px; height: 34px; border-radius: 50%;}
.live-quick-btn {color: #e4efe9; background: transparent;}
.live-quick-btn .icon {width: 18px; height: 18px;}
.live-send {color: #173a32; background: #9fe8d0;}
.live-send .icon {width: 15px; height: 15px;}
.live-send:disabled {color: #d3e0db; background: #ffffff14; opacity: .55; cursor: default;}
.live-action {width: 46px; height: 46px; border-radius: 50%;}
.live-action .icon {width: 22px; height: 22px;}
.live-action:hover {filter: brightness(1.12);}
.live-action-gift {background: #b63e61;}
.live-action-like {background: #593b50; color: #ffd5e2;}
.live-action-like .icon {fill: #ffc6db; stroke: #ffc6db;}
.live-action-wage {background: #584a71; color: #ede0ff;}
.live-effects {position: absolute; z-index: 3; inset: 0; pointer-events: none; overflow: hidden;}
.live-heart {
  position: absolute;
  right: 18px;
  bottom: 66px;
  color: #ff8db5;
  font-size: 32px;
  line-height: 1;
  filter: drop-shadow(0 3px 7px #c647778a);
  animation: live-heart-rise 1.15s ease-out both;
}
@keyframes live-heart-rise {
  0% {opacity: 0; transform: translate(0, 5px) scale(.65);}
  22% {opacity: 1; transform: translate(-9px, -25px) scale(1.1);}
  100% {opacity: 0; transform: translate(var(--heart-drift), -144px) scale(.88);}
}
.live-gift-event {
  position: absolute;
  left: 20px;
  bottom: 25%;
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: calc(100% - 42px);
  padding: 7px 16px 7px 7px;
  border: 1px solid #ffffff3d;
  border-radius: 25px;
  background: linear-gradient(115deg, #3c5760e8, #754558ea);
  box-shadow: 0 8px 24px #10161a35;
  animation: live-gift-arrive 2.5s ease both;
}
.live-gift-emblem {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #ffffff2b;
  font-size: 24px;
}
.live-gift-event strong, .live-gift-event small {display: block;}
.live-gift-event strong {font-size: 13px; color: #fff;}
.live-gift-event small {font-size: 10px; color: #ffeff4;}
@keyframes live-gift-arrive {
  0% {opacity: 0; transform: translateX(-28px);}
  15%, 80% {opacity: 1; transform: translateX(0);}
  100% {opacity: 0; transform: translateY(-12px);}
}
.live-page #toast {bottom: calc(66px + env(safe-area-inset-bottom));}

/* The room's controls use native dialogs so they can open without leaving the room. */
dialog.live-sheet {
  width: min(490px, calc(100% - 32px));
  max-width: none;
  max-height: min(80dvh, 690px);
  padding: 22px;
  border: 1px solid #e3ebe6;
  border-radius: 22px;
  background: #fff;
}
.live-sheet::backdrop {background: #0c1a19b3; backdrop-filter: blur(3px);}
.live-sheet .dialog-close {top: 12px; right: 14px;}
.live-sheet-handle {display: none;}
.live-sheet-title {margin: 0 42px 14px 0; color: #283d37; font-size: 18px;}
.live-sheet-copy {margin: 10px 0 16px; font-size: 13px; line-height: 1.8; color: #52685f;}
.live-transcript {white-space: pre-wrap; overflow-wrap: anywhere;}
.live-gift-balance {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
  color: #6e6654;
  font-size: 12px;
}
.live-gift-balance strong {color: #42382b;}
.live-sheet .gift-tray {padding: 0; border: 0; background: transparent;}
.live-sheet .gift-buttons {grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;}
.live-sheet .gift-btn {
  min-width: 0;
  min-height: 84px;
  padding: 8px 4px;
  border: 1px solid #e7eee9;
  border-radius: 13px;
  background: #f6faf7;
  color: #334b40;
}
.live-sheet .gift-btn:hover {background: #e8f4ee; border-color: #a8cbb9;}
.live-sheet .gift-emoji {font-size: 28px;}
.live-sheet .gift-cost {font-size: 11px; color: #6e694b;}
.live-gift-error {color: #a7324d; font-size: 11px; margin: 8px 0 0; min-height: 1.5em;}
.live-sheet-actions {display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px;}
.live-sheet-actions .btn {flex: 1 1 auto;}
.live-sheet-menu {display: grid; gap: 7px;}
.live-sheet-menu button {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid #edf2ef;
  border-radius: 10px;
  background: #f5f9f7;
  color: #365246;
  text-align: left;
  font-size: 13px;
}
.live-sheet-menu button:hover {background: #e8f4ee;}
.live-sheet-menu .icon {width: 17px; height: 17px; flex-shrink: 0;}
.live-sheet-menu button .icon:last-child {margin-left: auto; color: #688879;}
.live-sheet .sound-note {margin: 12px 0 0;}
.live-sheet .salary-grid > div {background: #f3f4f8;}
.live-received-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border-radius: 10px;
  background: #f7f1eb;
  font-size: 12px;
}
.live-received-summary strong {margin-left: auto; white-space: nowrap;}
.live-received-summary .icon {width: 16px; height: 16px; color: #9d6981;}
.live-profile-summary {display: flex; align-items: center; gap: 12px;}
.live-profile-summary .avatar {width: 54px; height: 54px;}
.live-profile-summary strong {display: block; margin-bottom: 4px; font-size: 16px;}
.live-profile-summary small {font-size: 11px; color: #62776e;}
.live-people-list {list-style: none; padding: 0; margin: 0;}
.live-people-list li {display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e8eeea;}
.live-people-list small {margin-left: auto; color: #62776e; font-size: 10px;}

@media (max-width: 760px) {
  .live-shell {min-height: 0; padding: 0; display: block;}
  .live-content {width: 100%;}
  .live-room {
    display: flex;
    flex-direction: column;
    height: var(--live-height, 100dvh);
    width: 100%;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .live-stage {position: static; flex: 1 1 auto;}
  .live-art {
    inset: 0 0 auto;
    height: 74%;
    mask-image: linear-gradient(#000 83%, transparent);
  }
  .live-stage-content {padding: calc(10px + env(safe-area-inset-top)) 14px 8px;}
  .live-shade {background: linear-gradient(180deg, #192b27ee 0%, #192b2799 17%, #192b270a 30%, #18272500 47%, #132522a6 62%, #132522e8 81%, #132522 100%);}
  .live-header {gap: 6px;}
  .live-header-buttons {gap: 5px;}
  .live-host {gap: 6px; padding-right: 7px;}
  .live-host .avatar {width: 37px; height: 37px;}
  .live-host-copy strong {font-size: 14px;}
  .live-host-copy small {font-size: 9px;}
  .live-icon-btn {width: 40px; height: 40px;}
  .live-follow {min-height: 34px; padding: 0 8px; font-size: 10px;}
  .live-status {margin-top: 10px; gap: 5px;}
  .live-heading {margin-top: 9px;}
  .live-heading h1 {font-size: 17px;}
  .live-caption {padding: 7px 10px; border-radius: 11px;}
  #reading-caption {font-size: 11px; -webkit-line-clamp: 2;}
  .live-conversation {
    flex: 0 0 auto;
    height: clamp(205px, calc(var(--live-height, 100dvh) * .36), 355px);
    padding-bottom: env(safe-area-inset-bottom);
    background: linear-gradient(180deg, #11252220, #122623b0 49%, #132522 100%);
    border: 0;
  }
  .live-chat-header {padding: 0 15px; min-height: 37px;}

  <script type="module">const speechSynthesis = window.speechSynthesis;
const SpeechSynthesisUtterance = window.SpeechSynthesisUtterance;

const STORAGE_KEY = 'zatuplay-kotonoha-live-v2';
const LEGACY_STORAGE_KEY = 'zatuplay-kotonoha-live-v1';
const DAILY_DIAMOND_SECONDS = 3 * 60 * 60;
const DIAMOND_EXCHANGE_RATE = 1;
const HOUR_MS = 60 * 60 * 1000;
const DAILY_DIAMOND_MS = DAILY_DIAMOND_SECONDS * 1000;
const DAY_MS = 24 * HOUR_MS;
const dateFormat = new Intl.DateTimeFormat('sv-SE', {
  timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit'
});

const RANKS = [
  {name: 'E', points: 1_200, hourlyDiamonds: 10},

  {name: 'D2', points: 9_000, hourlyDiamonds: 120},
  {name: 'D3', points: 28_000, hourlyDiamonds: 250},

  {name: 'C2', points: 88_000, hourlyDiamonds: 1_500},
  {name: 'C3', points: 120_000, hourlyDiamonds: 2_900},
  {name: 'B1', points: 330_000, hourlyDiamonds: 5_500},
  {name: 'B2', points: 660_000, hourlyDiamonds: 18_000},
  {name: 'A1', points: 1_100_000, hourlyDiamonds: 34_000},
  {name: 'A2', points: 3_300_000, hourlyDiamonds: 50_000},
  {name: 'S1', points: 9_900_000, hourlyDiamonds: 75_000},
  {name: 'S2', points: 25_000_000, hourlyDiamonds: 99_000},
  {name: 'S3', points: 50_000_000, hourlyDiamonds: 200_000, provisional: true},
  {name: 'EX', points: 99_999_999, hourlyDiamonds: 500_000}
];

const GIFTS = [
  {id: 'clap', name: '拍手', icon: '👏', cost: 10},
  {id: 'tea', name: 'おつかれさま', icon: '🍵', cost: 30},
  {id: 'flower', name: '一輪の花', icon: '🌷', cost: 50},
  {id: 'star', name: '星のかけら', icon: '🌟', cost: 100},
  {id: 'bouquet', name: '花束', icon: '💐', cost: 200},
  {id: 'moon', name: '月の贈りもの', icon: '🌙', cost: 500}
];

const TIME_MISSIONS = [
  {id: 'time-30m', title: '30分', target: 1800, points: 10, kind: 'time'},
  {id: 'time-1h', title: '1時間', target: 3600, points: 20, kind: 'time'},
  {id: 'time-2h', title: '2時間', target: 7200, points: 30, kind: 'time'},
  {id: 'time-3h', title: '3時間', target: 10800, points: 40, kind: 'time'}
];
const GIFT_MISSIONS = [
  [10, 100], [1000, 150], [5000, 500], [10000, 1500],
  [30000, 4000], [60000, 8000], [100000, 12000]
].map(([target, points]) => ({
  id: `received-${target}`, title: `${fmt(target)}ギフト`, target, points, kind: 'gift'
}));
const missions = [...TIME_MISSIONS, ...GIFT_MISSIONS];

function tokyoDay(now = Date.now()) {
  return dateFormat.format(now);
}
function previousDay(day) {
  return tokyoDay(Date.parse(`${day}T00:00:00+09:00`) - DAY_MS);
}
function daily(date) {
  return {date, seconds: 0, hostSeconds: 0, paidMilliseconds: 0, diamonds: 0, claimed: []};
}
function newState(now = Date.now()) {
  return {
    version: 2, name: 'ゲスト', giftPoints: 0, rankPoints: 0, diamonds: 0, diamondRemainder: 0,
    totalSeconds: 0, watchSeconds: 0, hostSeconds: 0,
    chatCount: 0, giftCount: 0, receivedCount: 0, claimedGiftMissions: [],
    lastLogin: '', loginStreak: 0, day: daily(tokyoDay(now)), history: [], favorites: [],
    settings: {sound: true, rate: 0.85, volume: 0.8},
    studio: {
      title: 'ことばを紡ぐ、小さな朗読会',
      script: '今日も、ここに来てくれてありがとう。\n言葉がひとつ、心に灯る。\nあなたの今日が、やさしい一日になりますように。'
    }
  };
}

function validCount(value) {
  return Number.isSafeInteger(value) && value >= 0 ? value : 0;
}
function validTime(value) {
  return Number.isFinite(value) && value >= 0 ? value : 0;
}
function loadState(storage, now = Date.now()) {
  const fresh = newState(now);
  try {
    const saved = storage.getItem(STORAGE_KEY) ?? storage.getItem(LEGACY_STORAGE_KEY);
    const raw = JSON.parse(saved);
    if (!raw || ![1, 2].includes(raw.version)) return fresh;
    const state = {...fresh, ...raw, version: 2};
    const countFields = ['giftPoints', 'rankPoints', 'diamonds', 'chatCount', 'giftCount', 'receivedCount', 'loginStreak'];
    for (const key of countFields) state[key] = validCount(state[key]);
    for (const key of ['totalSeconds', 'watchSeconds', 'hostSeconds']) state[key] = validTime(state[key]);
    state.diamondRemainder = validCount(state.diamondRemainder) % HOUR_MS;
    state.name = typeof raw.name === 'string' && raw.name.trim() ? raw.name.slice(0, 20) : fresh.name;
    state.history = Array.isArray(raw.history) ? raw.history.filter(item => item && Number.isFinite(item.at) && Number.isFinite(item.amount)).slice(0, 100) : [];
    state.favorites = Array.isArray(raw.favorites) ? raw.favorites : [];
    state.claimedGiftMissions = Array.isArray(raw.claimedGiftMissions) ? raw.claimedGiftMissions : [];
    state.day = {...fresh.day, ...raw.day};
    state.day.seconds = validTime(state.day.seconds);
    state.day.hostSeconds = validTime(state.day.hostSeconds);
    state.day.paidMilliseconds = Math.min(DAILY_DIAMOND_MS, validCount(state.day.paidMilliseconds));
    state.day.diamonds = validCount(state.day.diamonds);
    state.day.claimed = Array.isArray(state.day.claimed) ? state.day.claimed.filter(id => TIME_MISSIONS.some(mission => mission.id === id)) : [];
    state.settings = {...fresh.settings, ...raw.settings};
    state.settings.rate = Math.max(0.5, Math.min(1.3, Number(state.settings.rate) || 0.85));
    state.settings.volume = Math.max(0, Math.min(1, Number(state.settings.volume) || 0));
    state.studio = {
      title: typeof raw.studio?.title === 'string' ? raw.studio.title.slice(0, 50) : fresh.studio.title,
      script: typeof raw.studio?.script === 'string' ? raw.studio.script.slice(0, 3000) : fresh.studio.script
    };
    rollDay(state, now);
    return state;
  } catch {
    return fresh;
  }
}

function rollDay(state, now = Date.now()) {
  const date = tokyoDay(now);
  if (state.day.date !== date) state.day = daily(date);
}
function reachedRankIndex(state) {
  return RANKS.findLastIndex(rank => state.rankPoints >= rank.points);
}
function rankIndex(state) {
  return Math.max(0, reachedRankIndex(state));
}
function rankGoal(state) {
  return RANKS[reachedRankIndex(state) + 1];
}
function addHistory(state, label, amount, kind = 'gift', now = Date.now()) {
  state.history.unshift({id: `${now}-${Math.random().toString(36).slice(2, 7)}`, at: now, label, amount, kind});
  if (state.history.length > 100) state.history.length = 100;
}
function loginReward(state, now = Date.now()) {
  rollDay(state, now);
  const today = state.day.date;
  if (state.lastLogin === today) return 0;
  state.loginStreak = state.lastLogin === previousDay(today) ? state.loginStreak + 1 : 1;
  const amount = 100 + Math.min(state.loginStreak - 1, 6) * 50;
  state.lastLogin = today;
  state.giftPoints += amount;
  addHistory(state, `ログインボーナス ${state.loginStreak}日目`, amount, 'gift', now);
  return amount;
}

function addElapsed(state, milliseconds, mode, now) {
  const seconds = milliseconds / 1000;
  state.totalSeconds = (Math.round(state.totalSeconds * 1000) + milliseconds) / 1000;
  state.day.seconds = (Math.round(state.day.seconds * 1000) + milliseconds) / 1000;
  if (mode === 'watch') {
    state.watchSeconds += seconds;
    return;
  }
  state.hostSeconds += seconds;
  state.day.hostSeconds += seconds;
  const paidMilliseconds = Math.min(milliseconds, DAILY_DIAMOND_MS - state.day.paidMilliseconds);
  if (paidMilliseconds <= 0) return;
  state.day.paidMilliseconds += paidMilliseconds;
  const rank = RANKS[rankIndex(state)];
  state.diamondRemainder += paidMilliseconds * rank.hourlyDiamonds;
  const earned = Math.floor(state.diamondRemainder / HOUR_MS);
  state.diamondRemainder %= HOUR_MS;
  if (!earned) return;
  state.diamonds += earned;
  state.day.diamonds += earned;
  const label = `${rank.name}ランクの配信時給`;
  const last = state.history[0];
  if (last?.label === label && last.kind === 'diamond' && tokyoDay(last.at) === state.day.date) {
    last.amount += earned;
    last.at = now;
  } else {
    addHistory(state, label, earned, 'diamond', now);
  }
}

function advanceTime(state, seconds, mode = 'watch', now = Date.now()) {
  const milliseconds = Math.round(seconds * 1000);
  if (!Number.isSafeInteger(milliseconds) || milliseconds <= 0 || !['watch', 'host'].includes(mode)) return 0;
  const before = state.diamonds;
  const today = tokyoDay(now);
  const midnight = Date.parse(`${today}T00:00:00+09:00`);
  const elapsedToday = Math.min(milliseconds, now - midnight);
  const elapsedYesterday = milliseconds - elapsedToday;
  if (elapsedYesterday > 0 && state.day.date === previousDay(today)) {
    addElapsed(state, elapsedYesterday, mode, midnight - 1);
  }
  rollDay(state, now);
  if (elapsedToday > 0) addElapsed(state, elapsedToday, mode, now);
  return state.diamonds - before;
}

function missionProgress(state, mission) {
  return mission.kind === 'time' ? state.day.seconds : state.receivedCount;
}
function missionClaims(state, mission) {
  return mission.kind === 'time' ? state.day.claimed : state.claimedGiftMissions;
}
function missionClaimed(state, mission) {
  return missionClaims(state, mission).includes(mission.id);
}
function readyMissions(state) {
  return missions.filter(mission => missionProgress(state, mission) >= mission.target && !missionClaimed(state, mission));
}
function claimMission(state, id, now = Date.now()) {
  rollDay(state, now);
  const mission = missions.find(item => item.id === id);
  if (!mission || missionClaimed(state, mission) || missionProgress(state, mission) < mission.target) return 0;
  missionClaims(state, mission).push(id);
  state.rankPoints += mission.points;
  const label = mission.kind === 'time' ? `時間ミッション ${mission.title}` : `受取ギフトミッション ${mission.title}`;
  addHistory(state, label, mission.points, 'rank', now);
  return mission.points;
}
function sendGift(state, id, now = Date.now()) {
  const gift = GIFTS.find(item => item.id === id);
  if (!gift || state.giftPoints < gift.cost) return false;
  state.giftPoints -= gift.cost;
  state.giftCount++;
  addHistory(state, `${gift.name}を贈った`, -gift.cost, 'gift', now);
  return gift;
}
function receiveGift(state, id, sender, now = Date.now()) {
  const gift = GIFTS.find(item => item.id === id);
  if (!gift) return false;
  state.giftPoints += gift.cost;
  state.receivedCount++;
  addHistory(state, `NPC ${sender}から${gift.name}`, gift.cost, 'gift', now);
  return gift;
}
function exchangeDiamonds(state, amount, destination, now = Date.now()) {
  if (!Number.isSafeInteger(amount) || amount <= 0 || amount > state.diamonds) return 0;
  if (destination !== 'gift' && destination !== 'rank') return 0;
  const key = destination === 'gift' ? 'giftPoints' : 'rankPoints';
  const points = amount * DIAMOND_EXCHANGE_RATE;
  if (!Number.isSafeInteger(state[key] + points)) return 0;
  state.diamonds -= amount;
  state[key] += points;
  addHistory(state, 'ダイヤ交換', -amount, 'diamond', now);
  addHistory(state, 'ダイヤから交換', points, destination, now);
  return points;
}
function addChat(state) {
  state.chatCount++;
}

function duration(seconds) {
  const minutes = Math.floor(Math.max(0, seconds) / 60);
  const hours = Math.floor(minutes / 60);
  if (!hours) return `${minutes}分`;
  return minutes % 60 ? `${hours}時間${minutes % 60}分` : `${hours}時間`;
}
function clock(seconds) {
  const n = Math.max(0, Math.floor(seconds));
  return [Math.floor(n / 3600), Math.floor(n % 3600 / 60), n % 60].map(part => String(part).padStart(2, '0')).join(':');
}
function fmt(number) {
  return Math.floor(number).toLocaleString('ja-JP');
}

  {id:'koharu',name:'こはる',tag:'朗読',rank:'C2',title:'君に贈る、午後の小さな恋愛詩',note:'ひとつの詩が、今日を少しやさしくする。',color:'#eab6ba',bg:'#f2d9da',hair:'#67484c',shirt:'#e3b0b0',kind:0,count:24,rate:0.83,pitch:1.16,desc:'恋のことばと、やわらかな午後。ゆっくりと恋愛詩を読みます。',lines:['こんにちは、こはるです。今日も、ここで会えてうれしいです。少しだけ、詩を読んでもいいですか。','「となりの春」。あなたの隣で、見上げた空は、いつもより少し、広く見えた。何でもない日が、大切な日になる。あなたが、そこにいるだけで。','「待ち合わせ」。時計を見るたび、あなたに近づく。あと五分。あと三分。会う前からもう、幸せは始まっている。','みんなは、どんなときに、誰かを思い出しますか。何気ない景色の中にも、大切な人はいるのかもしれませんね。','「言葉の花」。言えなかった、ありがとう。届けられなかった、大好き。それでも心に咲く花は、今日も、あなたの方を向いている。']},

  const value = Math.min(missionProgress(state, mission), mission.target);

    ? `${clock(value)} / ${clock(mission.target)}`

}

    name.textContent = item.name;
    const line = document.createElement('small');
    line.textContent = label;
    detail.append(name, line);
    event.append(emblem, detail);
    effects.append(event);
  }
  setTimeout(() => event.remove(), 2600);
}
function startStudio(form){
 const title=form.elements.title.value.trim(),script=form.elements.script.value.trim();if(!title||!script){toast('タイトルと、読み上げることばを入力してください。');return;}
 state.studio={title:title.slice(0,50),script:script.slice(0,3000)};save();if(session?.mode==='host'){session.lineIndex=0;navigate('room');readNext();}else startSession(userHost(),'host');
}

function doClaim(id) {
  trackSessionTime();
  const before = reachedRankIndex(state);
  const points = claimMission(state, id);
  if (!points) {
    toast('ミッションの条件を満たすと報酬を受け取れます。');
    return;
  }
  save();
  shell();
  toast(`ミッション達成。+${fmt(points)} RP`);
  onRankChange(before);
}
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-action]');if(!button)return;
 const a=button.dataset.action,id=button.dataset.id;
 switch(a){
  case 'navigate':navigate(button.dataset.view);break;
  case 'join':{const h=HOSTS.find(x=>x.id===id);if(!h)break;if(session?.mode==='host'){openDialog(`<h2 class="dialog-title">配信を終えて、会いにいく？</h2><p class="dialog-text">今の配信時間と報酬は記録されます。</p><div class="dialog-actions"><button class="btn outline" data-action="close-dialog">配信を続ける</button><button class="btn primary" data-action="confirm-join" data-id="${h.id}">終了して入室</button></div>`);}else startSession(h);break;}
  case 'confirm-join':dialog.close();startSession(HOSTS.find(h=>h.id===id));break;
  case 'filter':category=button.dataset.category;renderView();break;
  case 'clear-search':category='すべて';query='';shell();break;
  case 'favorite': {
    const host = HOSTS.find(item => item.id === id);
    if (!host) break;
    const following = !state.favorites.includes(id);
    state.favorites = following ? [...state.favorites, id] : state.favorites.filter(item => item !== id);
    save();
    if (view === 'room') {
      button.innerHTML = liveFollowLabel(host);
      button.setAttribute('aria-pressed', following);
    } else renderView();
    break;
  }
  case 'refresh':toast('6人のNPCライバーが配信中です。気になる部屋を選んでね。');break;
  case 'about':showAbout();break;
  case 'bonus':showBonus();break;
  case 'claim-login':{const n=loginReward(state);save();dialog.close();shell();toast(n?`おかえりなさい。${n} Pを受け取りました！`:'今日のボーナスは受取済みです。');break;}
  case 'close-dialog':dialog.close();break;
  case 'claim':doClaim(id);break;

  case 'sound':setSpeechEnabled(!state.settings.sound);break;
  case 'read-again':if(session)setSpeechEnabled(true, true);break;
  case 'leave':exitSession();break;
  case 'room-close':closeLiveRoom();break;
  case 'room-options':showRoomOptions();break;
  case 'room-profile':showRoomProfile();break;
  case 'room-audience':showRoomAudience();break;
  case 'room-transcript':showRoomTranscript();break;
  case 'room-quick':showRoomQuickComments();break;
  case 'room-gifts':showRoomGifts();break;
  case 'room-earnings':showRoomEarnings();break;
  case 'room-like':addLiveLike();break;
  case 'chat-latest':scrollChatToLatest();break;
  case 'quick-chat':
    if (dialog.open) dialog.close();
    submitChat(button.dataset.text);
    break;
  case 'reply':selectReply(id);break;
  case 'cancel-reply':
    if (session) session.replyTo = null;
    updateReplyComposer();
    break;
  case 'exchange-max': {
    const form = document.querySelector('#exchange-form');
    if (form && state.diamonds) form.elements.amount.value = state.diamonds;
    updateExchangeForm();
    break;
  }
  case 'gift':gift(id);break;
  case 'gift-info':{const g=GIFTS.find(x=>x.id===id);openDialog(`<div class="dialog-icon">${g.icon}</div><h2 class="dialog-title">${g.name} · ${g.cost} P</h2><p class="dialog-text" style="text-align:center">好きなライバーの配信室で贈れます。<br>あたたかな気持ちを、声のそばへ。</p><div class="dialog-actions"><button class="btn primary" data-action="dialog-browse">配信をさがす ${icon('arrow')}</button></div>`);break;}
  case 'dialog-browse':dialog.close();navigate('home');break;
  case 'edit-studio':navigate('studio');break;
  case 'preview-voice':{const form=document.querySelector('#studio-form');const text=form.elements.script.value.trim();if(!text){toast('読み上げることばを入力してください。');break;}state.settings.sound=true;save();speak(text.slice(0,500));toast('原稿の声を確認しています。');break;}
  case 'reset-confirm':openDialog(`<h2 class="dialog-title">記録をリセットしますか？</h2><p class="dialog-text">ランク、ダイヤ、ポイント、ミッション、お気に入りをすべて消し、Eランクからはじめます。この操作は元に戻せません。</p><div class="dialog-actions"><button class="btn outline" data-action="close-dialog">キャンセル</button><button class="btn danger" data-action="reset">記録をリセット</button></div>`);break;
  case 'reset':stopSpeech();session=null;state=newState();save();dialog.close();navigate('home');toast('新しい、声の旅がはじまります。');break;
 }
});
document.addEventListener('submit',e=>{
 if (e.target.id === 'chat-form') {
   e.preventDefault();
   const input = e.target.querySelector('input');
   submitChat(input.value);
   input.value = '';
   if (session) session.draft = '';
   e.target.querySelector('#live-send').disabled = true;
 }
 if(e.target.id==='studio-form'){e.preventDefault();startStudio(e.target);}
 if(e.target.id==='exchange-form'){e.preventDefault();doExchange(e.target);}
 if(e.target.id==='profile-form'){e.preventDefault();const value=e.target.elements.name.value.trim();if(!value){toast('呼び名を入力してください。');return;}state.name=value.slice(0,20);save();shell();toast('呼び名を保存しました。');}
});
document.addEventListener('input',e=>{
 if (e.target.id === 'chat-input' && session) {
   session.draft = e.target.value;
   document.querySelector('#live-send').disabled = !session.draft.trim();
 }
 if (e.target.id === 'exchange-amount' || e.target.id === 'exchange-destination') updateExchangeForm();
 if(e.target.id==='room-search'){query=e.target.value.trim();if(view!=='home'){view='home';const pos=e.target.selectionStart;shell();const input=document.querySelector('#room-search');input.focus();input.setSelectionRange?.(pos,pos);}else document.querySelector('#room-grid').innerHTML=roomCards();}
});
document.addEventListener('change',e=>{
 if (e.target.id === 'exchange-destination') updateExchangeForm();
 if(e.target.id==='voice-rate'){state.settings.rate=Number(e.target.value);save();if(session&&state.settings.sound)readNext();}if(e.target.id==='voice-volume'){state.settings.volume=Number(e.target.value);save();if(session&&state.settings.sound)readNext();}});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});

window.visualViewport?.addEventListener('resize', updateLiveViewport);
window.addEventListener('resize', updateLiveViewport);
document.addEventListener('scroll', event => {
  const log = event.target;
  if (log.id !== 'chat-log' || log.scrollHeight - log.scrollTop - log.clientHeight >= 24) return;
  const latest = document.querySelector('#live-chat-latest');
  if (latest) latest.hidden = true;
}, true);


let androidForeground = true;
function updateAndroidVisibility(visible) {
  const previousDay = state.day.date;
  if (sessionVisible && !visible) trackSessionTime();
  const changed = sessionVisible !== visible;
  lastNow = performance.now();
  sessionVisible = visible;
  if (!visible) {
    stopSpeech();
    save();
    return;
  }
  rollDay(state);
  if (state.day.date !== previousDay) updateMissionButtons();
  updateCounters();
  if (changed && session && state.settings.sound) readNext();
}
document.addEventListener('visibilitychange', () => {
  updateAndroidVisibility(androidForeground && !document.hidden);
});
window.kotonohaAppPause = () => {
  androidForeground = false;
  updateAndroidVisibility(false);
};
window.kotonohaAppResume = () => {
  androidForeground = true;
  updateAndroidVisibility(!document.hidden);
};
window.kotonohaAndroidBack = () => {
  if (dialog.open) {
    dialog.close();
    return true;
  }
  if (view === 'room' && session) {
    closeLiveRoom();
    return true;
  }
  if (view !== 'home') {
    navigate('home');
    return true;
  }
  if (session) {
    navigate('room');
    return true;
  }
  return false;
};
window.addEventListener('pagehide', () => {
  trackSessionTime();
  save();
  stopSpeech();
});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){stopSpeech();session=null;state=loadState(localStorage);navigate('home');toast('別のタブの記録を読み込みました。このタブの配信は終了しました。');}});
if(Boolean(speechSynthesis)){refreshVoices();speechSynthesis.addEventListener('voiceschanged',()=>{refreshVoices();const note=document.querySelector('#sound-note');if(note&&!audioIssue)note.textContent=soundNote();});}

setInterval(() => {
  const previousDay = state.day.date;
  const wasReady = readyMissions(state).length;
  const earnedDiamonds = trackSessionTime();
  const newDay = previousDay !== state.day.date;
  if (newDay) {
    save();
    updateMissionButtons();
  }
  if (!session || document.hidden) return;
  if (session.seconds >= session.nextNpc) audienceTalk();
  if (session.mode === 'host' && session.seconds >= session.nextGift) {
    const person = (session.received + 1) % listeners.length;
    const gift = receiveGift(state, GIFTS[session.received % 3].id, listeners[person].name);
    session.received++;
    session.nextGift = session.seconds + 65;
    addMessage({type: 'gift', person, text: `${gift.icon} ${gift.name}を贈りました。今日もありがとう！`});
    showGift(gift, `${listeners[person].name}から届きました`);
    addLiveLike();
    save();
  }
  const dueReplies = session.replyQueue.filter(reply => reply.at <= session.seconds);
  session.replyQueue = session.replyQueue.filter(reply => reply.at > session.seconds);
  for (const reply of dueReplies) {
    if (reply.kind === 'host') {
      addMessage({type: 'host', text: reply.text});
      if (state.settings.sound && !audioIssue) {
        session.caption = reply.text;
        const caption = document.querySelector('#reading-caption');
        if (caption) caption.textContent = reply.text;
        speak(reply.text, {continue: true});
      }
    } else {
      addMessage({person: reply.person, text: reply.text});
    }
  }
  if ((!state.settings.sound || audioIssue || !(Boolean(speechSynthesis))) && session.seconds >= session.nextCaption) readNext();
  if (wasReady !== readyMissions(state).length) {
    updateMissionButtons();
    if (!newDay) toast('ミッション達成。報酬を受け取れます。');
  }
  if (earnedDiamonds && view === 'wallet') document.querySelector('#wallet-ledger').innerHTML = walletLedger();
  updateCounters();
  if (earnedDiamonds || ++tickCount % 5 === 0) save();
}, 1000);

shell();
</script>
</body>
</html>
