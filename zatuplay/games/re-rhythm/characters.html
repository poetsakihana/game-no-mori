<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクターデザイン集｜Reミラクルスターズ</title><style>*{box-sizing:border-box}body{background:#f6f3e9;color:#294653;font-family:system-ui;margin:0}main{max-width:1100px;padding:36px 20px;margin:auto}h1{font-size:32px}p{line-height:1.9}small{letter-spacing:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}article{border:1px solid #dddcd0;border-radius:24px;text-align:center;background:#fffdf6;padding:16px}canvas{width:100%;height:auto}h2{font-size:17px}a{color:#294653}</style><main><small>RE / MIRACLE STARS · CHARACTER DIRECTION 0.3</small><h1>一拍ごとに、表情が生まれる。</h1><p>濃紺の輪郭、やわらかな陰影、読みやすい表情。ゲームに実装した主要6キャラクターと、星図の8ボス肖像です。</p><a href="index.html">ゲームへ戻る →</a><h2>PLAYABLE CAST</h2><div class="grid" id="cast"></div><h2>WORLD GUARDIANS</h2><div class="grid" id="boss"></div></main><script src="character-art.js"></script><script src="sprite-art.js"></script><script>
const names=['しらたま','カサパホーマー','エキサイティング犬','シルバー姉さん','恐竜ちゃん','ピョコちんガエル'];const painters=[c=>artMascot(c,150,150,65,'#fff',true),c=>artParasol(c,150,190,63,'#ef8791',false),c=>artDog(c,150,155,'catch'),c=>artTrainer(c,150,130),c=>artDino(c,150,145,8),c=>artFrog(c,150,150,1.5)];function card(parent,name,fn){const a=document.createElement('article'),cv=document.createElement('canvas'),h=document.createElement('h2');cv.width=300;cv.height=280;cv.setAttribute('role','img');cv.setAttribute('aria-label',name);a.append(cv,h);h.textContent=name;document.querySelector(parent).append(a);fn(cv.getContext('2d'))}names.forEach((n,i)=>card('#cast',n,painters[i]));['芽吹きの指揮者モス','傘守レイン','月鯨ルーナ','時計師ギア','嵐の奏者ボルト','仮面のミラ','静寂王ノクス','星海のオーケストラ'].forEach((n,i)=>card('#boss',n,c=>artBoss(c,i,150,140,240)));
castAtlas.addEventListener('load',()=>{document.querySelector('#cast').replaceChildren();names.forEach((n,i)=>card('#cast',n,painters[i]))});</script></html>
