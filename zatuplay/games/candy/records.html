<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録と結末</title><style>body{font:17px/1.8 system-ui;max-width:680px;margin:32px auto;padding:20px;background:#faf6ef;color:#292332}button,a{font:inherit;margin:8px;padding:10px}section{padding:20px;background:white;border-radius:16px;margin:20px 0}button:disabled{opacity:.5}</style><h1>Candy Reverie · 記録と結末</h1><a href="./">ゲームへ戻る</a><p>APKとは別の、このブラウザ版だけの記録です。再鑑賞で報酬や記録は変わりません。</p><section id="ending" hidden><h2>結末をもう一度</h2><p>10の世界に朝が来ました。５人の願いが、ひとつの夢になりました。</p><p>この結末の後も、ゲームへ戻って再挑戦できます。</p></section><p id="status" role="status"></p><section><h2>原文と退避記録</h2><button id="raw">現在の保存原文を保管</button><button id="previous">直前の退避原文を保管</button><button id="recover">直前の退避へ戻す</button><p>退避は1世代です。次の初期化・復元で入れ替わります。原文はこの画面の退避用で、ゲーム内の通常JSON読込とは形式が異なる場合があります。</p></section><section><h2>記録を初期化</h2><p>ゲーム中には操作できない別画面です。同じゲームのほかのタブを閉じてから操作してください。単なる再挑戦はゲーム内で行ってください。</p><button id="prepare">初期化前のバックアップを保存</button><label><input id="confirmed" type="checkbox">ファイルの保存を確認し、ほかのタブを閉じました</label><button id="apply" disabled>初期化の最終確認へ</button></section><script src="record-config.js"></script><script src="manage-core.js"></script><script src="records-boot.js?v=1.0.0-web.2"></script></html>
