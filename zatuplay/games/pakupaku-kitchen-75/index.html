  <style>:root {
  color-scheme: light;
  --paper: #fff9ed;
  --ink: #37251c;
  --muted: #745f50;
  --accent: #a8351c;
  --line: #eddfca;
  --white: #fffdf8;
  --hero: #ffce6c;
  --green: #3d7552;
  --radius: 22px;
  font-family: "Nunito", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button, select, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button, select { cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #12756a; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, b, strong { font-weight: 850; }
img, svg { vertical-align: middle; }
.loading { margin: 6rem auto; text-align: center; color: var(--muted); }
.site-header { background: #fffcf4; border-bottom: 1px solid var(--line); }
.header-content, .main, .site-footer { width: min(1192px, calc(100% - 92px)); margin-inline: auto; }
.header-content { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 76px; column-gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; justify-self: start; border: 0; padding: 0; background: transparent; font-size: 17px; font-weight: 900; white-space: nowrap; letter-spacing: -.05em; }
.nav { display: flex; align-items: center; gap: 7px; }
.nav-tab { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 750; white-space: nowrap; padding: 11px 14px; border: 0; border-radius: 9px; background: transparent; color: #625144; }
.nav-tab:hover { background: #fbefd9; }
.nav-tab[aria-current] { background: #f9e9cf; color: #803819; }
.header-tools { justify-self: end; display: flex; align-items: center; gap: 9px; }
.audio-settings { display: flex; align-items: center; gap: 4px; }
.audio-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 34px; padding: 4px 7px; color: #793b22; background: #fff0d8; border: 1px solid #ebd6b3; border-radius: 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.audio-toggle:hover { border-color: #bf8b62; }
.audio-toggle[aria-pressed="false"] { color: #68584c; background: transparent; border-color: #ecdfcd; }
.audio-symbol { position: relative; display: inline-flex; }
.audio-toggle[aria-pressed="false"] .audio-symbol::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: currentColor; box-shadow: 0 -1px #fffcf4; transform: rotate(-43deg); }
.header-progress { display: flex; gap: 6px; align-items: center; background: #fff7e7; border: 1px solid #f3e3c9; border-radius: 100px; padding: 8px 13px; white-space: nowrap; }
.header-progress strong { font-size: 17px; line-height: 1; }
.total-label { font-size: 12px; font-weight: 750; color: var(--muted); }
.main { padding-top: 33px; min-height: calc(100vh - 160px); padding-bottom: 62px; }
.hero { min-height: 376px; display: grid; grid-template-columns: 45% 55%; position: relative; overflow: hidden; background: var(--hero); border: 1px solid #f0b64c; border-radius: 27px; isolation: isolate; box-shadow: 0 5px 0 #f4e4c8; }
.hero-copy { z-index: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 42px 0 43px clamp(27px, 4.7vw, 69px); }
.hero-label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 6px; color: #753913; border: 1px solid #b86f2d70; border-radius: 28px; background: #ffdb89; font-size: 12px; font-weight: 800; }
.hero h1 { margin: 12px 0 12px; font-size: clamp(45px, 5.15vw, 77px); line-height: 1.02; letter-spacing: -.11em; color: #3b281b; font-weight: 950; white-space: nowrap; }
.hero h1 span { display: block; color: #982f18; margin-top: 2px; }
.hero p { line-height: 1.7; font-size: 15px; font-weight: 750; color: #593a25; margin-bottom: 24px; }
.hero-art { align-self: stretch; position: relative; min-width: 0; }
.hero-art img { height: 100%; width: 100%; object-fit: cover; object-position: 52% 43%; position: absolute; }
.hero-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--hero), #ffce6c00 20%); }
.primary, .secondary { display: inline-flex; align-items: center; justify-content: center; gap: 11px; border-radius: 12px; padding: 12px 18px; min-height: 47px; font-size: 14px; font-weight: 850; transition: background .15s, transform .15s; }
.primary { color: #fffaf0; background: var(--accent); border: 1px solid #8c2915; box-shadow: 0 3px 0 #74240f; }
.primary:hover { background: #912915; }
.primary:active, .secondary:active { transform: translateY(2px); }
.primary:disabled { opacity: .62; }
.secondary { border: 1px solid #e5d5bd; background: var(--white); color: var(--ink); }
.secondary:hover { background: #f6e9d5; }
.recipe-section { margin-top: 38px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.section-heading h2 { font-size: clamp(25px, 3vw, 33px); letter-spacing: -.075em; }
.section-heading p, .chapter-heading p { margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.6; }
.section-progress { flex: none; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
.section-progress b { color: var(--ink); margin: 0 2px; }
.chapter-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
.chapter-tab { min-height: 61px; min-width: 0; display: flex; align-items: center; text-align: left; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fffdf7; transition: background .15s; }
.chapter-tab:hover { background: #fff1d8; }
.chapter-tab[aria-pressed="true"] { border-color: #bc5836; background: #ffefdf; box-shadow: inset 0 0 0 1px #bc583628; color: #8b321b; }
.chapter-symbol { display: grid; place-items: center; width: 35px; height: 35px; flex: none; border-radius: 9px; font-size: 18px; color: #624e3f; }
.chapter-tab b, .chapter-tab small { display: block; white-space: nowrap; }
.chapter-tab b { font-size: 14px; }
.chapter-tab small { color: #715b4e; font-size: 11px; margin-top: 1px; }
.chapter-heading { margin: 27px 0 14px; display: flex; gap: 8px; align-items: end; justify-content: space-between; }
.chapter-heading h3 { font-size: 22px; letter-spacing: -.06em; }
.locked-tag { display: inline-flex; align-items: center; gap: 4px; color: #6e4d3a; border-radius: 8px; border: 1px solid #eedfcb; padding: 5px 8px; font-size: 12px; white-space: nowrap; }
.recipe-grid { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.recipe-card { background: var(--white); border: 1px solid var(--line); border-radius: 17px; display: flex; flex-direction: column; gap: 9px; min-width: 0; padding: 11px 11px 10px; text-align: left; transition: transform .15s, border-color .15s; }
.recipe-card:hover:not(:disabled) { transform: translateY(-3px); border-color: #cd8a61; }
.recipe-card:disabled { opacity: .72; }
.food-icon { display: grid; place-items: center; border-radius: 11px; min-height: 78px; width: 100%; font-size: 37px; line-height: 1.1; background: #fae7c5; }
.peach { background: #f9dfc7; } .sage { background: #e0ead5; } .gold { background: #f9ebc3; } .blue { background: #dceced; } .pink { background: #f6dedb; } .lilac { background: #ebe1f1; }
.recipe-details { display: flex; flex-direction: column; gap: 7px; padding: 0 2px; flex: 1; }
.recipe-details strong { font-size: 15px; letter-spacing: -.035em; line-height: 1.34; overflow-wrap: anywhere; }
.recipe-tags { display: flex; gap: 3px; flex-wrap: wrap; }
.recipe-tags span { padding: 2px 5px; border-radius: 5px; background: #f7eee0; color: #634c3f; font-size: 10px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; color: var(--muted); font-size: 11px; }
.card-foot svg { color: #975234; }
.stars, .result-stars { color: #a05b08; font-weight: 900; letter-spacing: .12em; }
.site-footer { color: var(--muted); font-size: 11px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 7px; border-top: 1px solid var(--line); padding-block: 13px 18px; }
.site-footer > span:first-child { display: flex; align-items: center; gap: 5px; font-weight: 750; }
.page-panel, .play-panel { max-width: 750px; margin-inline: auto; }
.page-panel { padding: clamp(21px, 5vw, 48px); background: var(--white); border: 1px solid var(--line); box-shadow: 0 4px 0 #f3e7d4; border-radius: var(--radius); }
.page-panel h1, .play-panel h1 { font-size: clamp(29px, 5.5vw, 46px); line-height: 1.18; letter-spacing: -.07em; overflow-wrap: anywhere; }
.page-panel p { margin-top: 8px; color: var(--muted); line-height: 1.6; }
.page-panel .primary { margin-top: 19px; }
.subheading { font-size: 20px; margin: 25px 0 10px; }
.back-link { display: flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 0; font-size: 13px; font-weight: 800; color: #813c25; margin-bottom: 19px; }
.eyebrow, .page-panel .eyebrow { color: #9a472f; font-weight: 850; font-size: 12px; margin: 0 0 6px; }
.ready-title { display: flex; gap: 16px; align-items: center; }
.food-icon.big { width: 95px; min-height: 94px; flex: none; font-size: 52px; }
.steps-list { padding: 0; list-style: none; margin: 0; display: grid; gap: 7px; }
.steps-list li { display: flex; gap: 10px; align-items: center; background: #fbf3e6; border-radius: 9px; padding: 9px 12px; }
.steps-list li > span { display: grid; place-items: center; background: var(--white); border-radius: 7px; height: 35px; width: 35px; flex: none; }
.steps-list li b { font-size: 13px; }
.steps-list li p { margin: 2px 0 0; font-size: 13px; }
.locked-panel, .result-panel { text-align: center; }
.feature-icon { display: grid; place-items: center; width: 70px; height: 70px; color: #854222; border-radius: 18px; margin-bottom: 14px; }
.locked-panel .feature-icon, .result-panel .big { margin: 0 auto 15px; }
.unlock-progress { max-width: 330px; margin: 22px auto 0; }
.unlock-progress > span { font-size: 13px; color: var(--muted); }
progress { appearance: none; border: 0; display: block; width: 100%; height: 11px; border-radius: 30px; background: #ead9bf; overflow: hidden; }
progress::-webkit-progress-bar { background: #ead9bf; }
progress::-webkit-progress-value { background: #55845c; border-radius: 30px; }
progress::-moz-progress-bar { background: #55845c; border-radius: 30px; }
.unlock-progress progress { margin-top: 7px; }
.race-form { display: grid; align-items: start; justify-items: start; gap: 13px; margin-top: 19px; max-width: 440px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 850; }
.race-form label { width: 100%; }
input, select { background: #fffaf0; border: 1px solid #e3d3be; border-radius: 9px; width: 100%; min-height: 45px; padding: 8px 11px; font-weight: 650; font-size: 16px; }
.race-form .primary { margin-top: 0; }
.ranking-select { margin-top: 17px; }
.ranking-message { background: #fbf2e4; border-radius: 11px; padding: 17px; margin-block: 17px !important; }
.text-button { padding: 0 3px; color: var(--accent); text-decoration: underline; border: 0; background: transparent; }
.table-scroll { overflow: auto; margin: 16px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
td, th { padding: 10px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; }
td:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.play-title { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin-bottom: 15px; }

const stepTypes = { 切: "cut", 炒: "saute", 焼: "bake", 煮: "simmer", 混: "mix", 揚: "fry", 蒸: "steam" };
const order = ["cut", "saute", "bake", "simmer", "mix", "fry", "steam"];
let id = 0;
const recipes = menus.flatMap((menu, chapter) => menu.map(([name, emoji, color, ...steps]) => {
  const recipe = {
    id: ++id, name, emoji, color, chapter,
    steps: steps.map((step) => {
      const space = step.indexOf(" ");
      return { type: stepTypes[step[0]], emoji: step.slice(1, space), direction: step.slice(space + 1) };
    }),
  };
  recipe.techniques = order.filter((type) => recipe.steps.some((step) => step.type === type));
  return recipe;
}));

function getCourse(course) {
  if (course === "all") return recipes;
  if (!/^[1-9]\d?$/.test(course)) return [];
  const recipe = recipes[Number(course) - 1];
  return recipe ? [recipe] : [];
}

const TICK_MS = 50;
const PENALTY_MS = 2000;

const techniques = {
  cut: { label: "包丁", verb: "切る", icon: "🔪", button: "トントン切る", tip: "食材をリズムよく切ろう。連打が早すぎるとミスになるよ。" },

  simmer: { label: "煮込み", verb: "煮る", icon: "🥘", tip: "弱火・中火・強火を切り替えて、温度を緑の範囲に保とう。" },

  steam: { label: "蒸し", verb: "蒸す", icon: "♨️", tip: "弱火・中火・強火を切り替えて、蒸気を緑の範囲に保とう。" },
};

const isHeat = (type) => type === "simmer" || type === "steam";

function configFor(recipe, stepIndex) {
  const level = recipe.chapter;
  const type = recipe.steps[stepIndex].type;
  const variation = (recipe.id + stepIndex * 2) % 3;
  if (type === "cut" || type === "mix") {
    return { goal: 5 + level + variation, interval: type === "mix" ? 5 : 4, max: 22 - level };
  }
  if (isHeat(type)) {
    const center = (type === "steam" ? 57 : 63) + variation;
    const width = 11 - level;
    return { goal: 30 + level * 8, min: center - width, max: center + width };
  }
  const max = type === "saute" ? 26 - level : 38 - level * 2;
  const zone = type === "fry" ? 0.56 : 0.49;
  return {
    goal: (type === "saute" ? 3 : 1) + Math.floor((level + 1) / 2),
    from: Math.floor(max * zone) + variation,
    to: Math.floor(max * zone) + variation + 9 - level,
    max,
  };
}

function createGame(course, mode = "practice") {
  if (!course.length) throw new Error("A course must have at least one recipe.");
  const game = { course, mode, dish: 0, time: 0, totalMistakes: 0, result: [], done: false, failed: false };
  startDish(game);
  return game;
}

function startDish(game) {
  game.recipe = game.course[game.dish];
  game.dishMistakes = 0;
  game.dishStart = game.time;
  game.dishDeadline = game.time + (game.recipe.steps.length > 3 ? 2400 : 1800);
  game.step = 0;
  startStep(game);
}

function startStep(game) {
  game.type = game.recipe.steps[game.step].type;
  game.config = configFor(game.recipe, game.step);
  game.count = 0;
  game.anchor = game.time;
  game.lastAction = -Infinity;
  game.heat = 32;
  game.power = 1;
  game.danger = 0;
  game.stageStart = game.time;
}

function mistake(game, feedback) {
  game.lastMistake = { time: game.time, feedback };
  game.dishMistakes += 1;
  game.totalMistakes += 1;
  if (game.dishMistakes >= 7) game.failed = true;
}

function finishStep(game) {
  game.lastSuccess = game.time;
  game.step += 1;
  if (game.step < game.recipe.steps.length) {
    startStep(game);
    return;
  }
  game.result.push({
    id: game.recipe.id,
    ticks: game.time - game.dishStart,
    stars: game.dishMistakes < 2 ? 3 : game.dishMistakes < 4 ? 2 : 1,
  });
  if (game.dish + 1 === game.course.length) {
    game.done = true;
    return;
  }
  game.dish += 1;
  startDish(game);
}

function advance(game, targetTick) {
  while (!game.done && !game.failed && game.time < targetTick) {
    game.time += 1;
    if (game.time >= game.dishDeadline) {
      game.failed = true;
      game.lastMistake = { time: game.time, feedback: "制限時間になったよ。" };
      break;
    }
    const config = game.config;
    const age = game.time - game.anchor;
    if (isHeat(game.type)) {
      const wave = Math.floor((game.time - game.stageStart) / (18 - game.recipe.chapter)) % 2;
      const delta = [-4, wave ? -1 : 2, 5][game.power];
      game.heat = Math.max(0, Math.min(100, game.heat + delta));
      if (game.heat >= config.min && game.heat <= config.max) {
        game.count += 1;
        game.danger = 0;
        if (game.count >= config.goal) finishStep(game);
      } else if (game.heat > config.max + 14) {
        game.danger += 1;
        if (game.danger >= 14) {
          game.danger = 0;
          mistake(game, "熱くなりすぎたよ。火を弱めよう。");
        }
      } else {
        game.danger = 0;
      }
    } else if (game.type === "mix") {
      if (game.count && age > config.max) {
        game.count -= 1;
        game.anchor = game.time;
      }
    } else if (game.type !== "cut" && age > config.max) {
      game.anchor = game.time;
      mistake(game, game.type === "saute" ? "振るタイミングが遅かったよ。" : "火を通しすぎたよ。");
    }
  }
}

function act(game, action) {
  if (game.done || game.failed) return false;
  const config = game.config;
  if (isHeat(game.type)) {
    if (action < 1 || action > 3) return false;
    game.power = action - 1;
    return true;
  }
  if (action !== 0) return false;
  const gap = game.time - game.lastAction;
  game.lastAction = game.time;
  if (game.type === "cut" || game.type === "mix") {
    if (gap < config.interval) {
      mistake(game, "ちょっと早いよ。リズムを整えよう。");
      return true;
    }
  } else {
    const position = game.time - game.anchor;
    if (position < config.from || position > config.to) {
      mistake(game, "緑の範囲をねらおう。");
      game.anchor = game.time;
      return true;
    }
  }
  game.anchor = game.time;
  game.count += 1;
  game.lastSuccess = game.time;
  if (game.count >= config.goal) finishStep(game);
  return true;
}

function heatStep(type) {
  return isHeat(type);
}

function verifyRun(course, actions, endTick) {
  if (!Array.isArray(actions) || actions.length > 10000 || !Number.isInteger(endTick) || endTick < 1 || endTick > 144000) return null;
  const game = createGame(course, "ranked");
  let lastTick = 0;
  for (const event of actions) {
    if (!Array.isArray(event) || event.length !== 2) return null;
    const [tick, action] = event;
    if (!Number.isInteger(tick) || tick < lastTick || tick > endTick || !Number.isInteger(action) || action < 0 || action > 3) return null;
    advance(game, tick);
    if (!act(game, action)) return null;
    lastTick = tick;
  }
  advance(game, endTick);
  if (!game.done || game.time !== endTick) return null;
  return { milliseconds: endTick * TICK_MS, mistakes: game.totalMistakes };
}

const beatSeconds = 60 / 104;
const loopBeats = 32;

// Chord, bass and melody for each bar of the kitchen theme.
const theme = [
  [[60, 64, 67, 71], 48, [[0, 76], [0.5, 79], [1.5, 81], [2, 79], [3, 76], [3.5, 74]]],
  [[60, 64, 67, 69], 45, [[0, 72], [1, 76], [1.5, 79], [2.5, 76], [3, 72]]],
  [[60, 62, 65, 69], 50, [[0, 74], [0.5, 77], [1.5, 81], [2, 84], [3, 81], [3.5, 77]]],
  [[59, 62, 65, 67], 43, [[0, 79], [1, 77], [1.5, 74], [2.5, 71], [3, 74]]],
  [[60, 64, 67, 71], 48, [[0, 76], [0.5, 79], [1.5, 84], [2.5, 83], [3, 79]]],
  [[59, 62, 64, 67], 40, [[0, 76], [1, 79], [1.5, 83], [2, 81], [3, 79]]],

  ...chord.flatMap((note, index) => [0.5, 1.5, 2.75, 3.5].map((beat) => ({
    beat: bar * 4 + beat + index * 0.027, note, voice: "chord",
  }))),

const stations = {
  saute: { frequency: 3100, volume: 0.065, filter: "highpass" },
  bake: { frequency: 650, volume: 0.035, filter: "bandpass" },
  simmer: { frequency: 330, volume: 0.04, filter: "lowpass" },
  fry: { frequency: 2150, volume: 0.085, filter: "highpass" },
  steam: { frequency: 950, volume: 0.064, filter: "bandpass" },
};

function createKitchenAudio(initialPreferences) {
  let preferences = { ...initialPreferences };
  let context;
  let music;
  let effects;
  let noise;
  let ambience;
  let station = null;
  let heat = 1;
  let clock;
  let visible = true;
  let nextBubble = 0;
  let measureStart = 0;
  let musicIndex = 0;
  let themePlaying = false;
  let resume;
  let closed = false;

  function envelope(gain, time, duration, level, attack = 0.009) {
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(level, time + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
  }

  function tone(bus, frequency, endFrequency, time, duration, level, shape = "sine") {
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = shape;
    oscillator.frequency.setValueAtTime(frequency, time);
    oscillator.frequency.exponentialRampToValueAtTime(endFrequency, time + duration);
    envelope(gain, time, duration, level, 0.006);
    oscillator.connect(gain).connect(bus);
    oscillator.start(time);
    oscillator.stop(time + duration);
  }

  function noiseSource(loop = false) {
    if (!noise) {
      noise = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
      const samples = noise.getChannelData(0);
      for (let i = 0; i < samples.length; i += 1) samples[i] = Math.random() * 2 - 1;
    }
    const source = context.createBufferSource();
    source.buffer = noise;
    source.loop = loop;
    return source;
  }

  function burst(time, duration, frequency, volume, type = "bandpass") {
    const source = noiseSource();
    const filter = context.createBiquadFilter();
    const gain = context.createGain();
    filter.type = type;
    filter.frequency.value = frequency;
    filter.Q.value = 0.82;
    envelope(gain, time, duration, volume, 0.003);
    source.connect(filter).connect(gain).connect(effects);
    source.start(time, Math.random() * (2 - duration));
    source.stop(time + duration);
  }

  function bubble(time, base) {
    tone(effects, base, base * 1.65, time, 0.12, 0.062);
    tone(effects, base * 0.7, base * 0.54, time + 0.078, 0.085, 0.036);
  }

  function play(action) {
    if (context?.state !== "running" || !visible || !preferences.effects) return;
    const time = context.currentTime + 0.006;
    switch (action) {
      case "cut":
        burst(time, 0.045, 1800, 0.38);
        tone(effects, 185 + Math.random() * 45, 75, time, 0.071, 0.14, "triangle");
        break;
      case "saute":
        burst(time, 0.45, 3500, 0.24, "highpass");
        tone(effects, 605, 230, time, 0.055, 0.045, "triangle");
        burst(time + 0.13, 0.10, 5400, 0.15);
        break;
      case "bake":
        burst(time, 0.38, 1100, 0.30);
        burst(time + 0.105, 0.09, 2400, 0.18);
        burst(time + 0.18, 0.105, 3100, 0.15);
        break;
      case "simmer":
        bubble(time, 170);
        bubble(time + 0.12, 205);
        break;
      case "mix":
        burst(time, 0.17, 840, 0.26);
        burst(time + 0.08, 0.12, 420, 0.18);
        break;
      case "fry":
        burst(time, 0.48, 2250, 0.31, "highpass");
        burst(time + 0.04, 0.20, 4800, 0.16);
        break;
      case "steam":
        burst(time, 0.52, 1180, 0.25);
        break;
      case "miss":
        tone(effects, 233, 130, time, 0.15, 0.11, "triangle");
        break;
      case "done":
        [523.25, 659.25, 783.99, 1046.50].forEach((frequency, index) => {
          tone(effects, frequency, frequency, time + index * 0.085, 0.36, 0.135, "triangle");
        });
        break;
    }
  }

  function playThemeNote(event, time) {
    const frequency = 440 * Math.pow(2, (event.note - 69) / 12);
    if (event.voice === "lead") {
      tone(music, frequency, frequency, time, 0.42, 0.21, "triangle");
      tone(music, frequency * 2, frequency * 2, time, 0.18, 0.05);
    } else if (event.voice === "chord") {
      tone(music, frequency, frequency, time, 0.23, 0.064, "triangle");
    } else {
      tone(music, frequency, frequency, time, 0.42, 0.15, "triangle");
    }
  }

  function schedule() {
    if (context?.state !== "running" || !visible) return;
    const now = context.currentTime;
    if (themePlaying) {
      const nextNote = measureStart + theme[musicIndex].beat * beatSeconds;
      if (now - nextNote > 0.35) {
        measureStart = now + 0.05;
        musicIndex = 0;
      }
      while (measureStart + theme[musicIndex].beat * beatSeconds < now + 0.20) {
        const event = theme[musicIndex];
        playThemeNote(event, Math.max(now, measureStart + event.beat * beatSeconds));
        musicIndex += 1;
        if (musicIndex === theme.length) {
          musicIndex = 0;
          measureStart += loopBeats * beatSeconds;
        }
      }
    }
    if (preferences.effects && (station === "simmer" || station === "steam") && nextBubble < now + 0.20) {
      const time = Math.max(now + 0.006, nextBubble);
      if (station === "simmer") bubble(time, 115 + Math.random() * 120 + heat * 14);
      else burst(time, 0.23, 1200, 0.065);
      nextBubble = time + (station === "simmer" ? [0.84, 0.53, 0.32][heat] : [1.02, 0.72, 0.52][heat]) + Math.random() * 0.22;
    }
  }

  function stopAmbience() {
    if (!ambience) return;
    const now = context.currentTime;
    ambience.gain.gain.setTargetAtTime(0, now, 0.026);
    ambience.source.stop(now + 0.14);
    ambience = null;
  }

  function sync() {
    if (context?.state !== "running" || closed) return;
    const now = context.currentTime;
    const musicOn = visible && preferences.music;
    const effectsOn = visible && preferences.effects;
    music.gain.setTargetAtTime(musicOn ? 0.26 : 0, now, 0.020);
    effects.gain.setTargetAtTime(effectsOn ? 0.80 : 0, now, 0.012);
    if (musicOn && !themePlaying) {
      measureStart = now + 0.035;
      musicIndex = 0;
    }
    themePlaying = musicOn;
    const config = effectsOn && stations[station];
    if (ambience && (!config || ambience.station !== station)) stopAmbience();
    if (config && !ambience) {
      const source = noiseSource(true);
      const filter = context.createBiquadFilter();
      const gain = context.createGain();
      filter.type = config.filter;
      filter.frequency.value = config.frequency;
      filter.Q.value = 0.60;
      gain.gain.value = 0;
      source.connect(filter).connect(gain).connect(effects);
      source.start();
      ambience = { source, gain, station };
      nextBubble = now + 0.14;
    }
    if (ambience) {
      const heatScale = station === "simmer" || station === "steam" ? [0.55, 1, 1.4][heat] : 1;
      ambience.gain.gain.setTargetAtTime(config.volume * heatScale, now, 0.04);
    }

    if (musicOn || (effectsOn && (station === "simmer" || station === "steam"))) {
      if (clock === undefined) {
        schedule();
        clock = setInterval(schedule, 70);
      }
    } else if (clock !== undefined) {
      clearInterval(clock);
      clock = undefined;
    }
  }

  function activate() {
    if (closed || (!preferences.music && !preferences.effects)) return;
    if (!context) {
      const Audio = window.AudioContext ?? window.webkitAudioContext;
      if (!Audio) return;
      try {
        context = new Audio();
        music = context.createGain();
        effects = context.createGain();
        music.gain.value = effects.gain.value = 0;
        music.connect(context.destination);
        effects.connect(context.destination);
        context.onstatechange = sync;
        sync();
      } catch {
        return;
      }
    }
    if (context.state !== "running" && !resume) {
      resume = context.resume().then(sync).catch(() => {}).finally(() => { resume = undefined; });
    }
  }

  return {
    activate,
    play,
    setPreferences(next) {
      preferences = { ...next };
      sync();
    },
    setStation(type, power = 1) {
      if (station === type && heat === power) return;
      station = type;
      heat = power;
      sync();
    },
    setVisible(active) {
      visible = active;
      sync();
    },
    dispose() {
      closed = true;
      clearInterval(clock);
      if (context) {
        context.onstatechange = null;
        void context.close().catch(() => {});
      }
    },
  };
}

const localKey = "pakupaku:ranked-times";
const topCount = 20;

function makePlayerId() {
  if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
  return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
}

function deviceRanking(storage = window.localStorage) {
  let active;
  let records = {};
  try {
    const stored = JSON.parse(storage.getItem(localKey));
    if (stored && typeof stored === "object") records = stored;
  } catch { /* Records remain usable for the duration of this game. */ }

  function problem(message, status = 400) {
    const error = new Error(message);
    error.status = status;
    throw error;
  }

  return {
    offline: true,
    async list(course) { return records[course] ?? []; },
    async start({ name, course }) {
      const normalizedName = name.trim().normalize("NFC");
      if (!normalizedName || Array.from(normalizedName).length > 16 || /[\p{C}]/u.test(normalizedName)) {
        problem("ニックネームを1〜16文字で入力してね。");
      }
      if (!getCourse(course).length) problem("コースを選び直してね。");
      const token = makePlayerId();
      active = { token, name: normalizedName, course };
      return { token };
    },
    async finish({ token, actions, ticks }) {
      if (!active || token !== active.token) problem("この挑戦の記録受付は終了したよ。", 409);
      const { course, name } = active;
      const verified = verifyRun(getCourse(course), actions, ticks);
      if (!verified) problem("調理記録を確認できなかったよ。", 422);
      active = null;
      const score = verified.milliseconds + verified.mistakes * PENALTY_MS;
      const entries = records[course] ?? [];
      const previous = entries.find((entry) => entry.name === name);
      const best = !previous || score < previous.score;
      if (best) {
        records[course] = [
          ...entries.filter((entry) => entry.name !== name),
          { name, elapsed: verified.milliseconds, mistakes: verified.mistakes, score, finished: Date.now() },
        ].sort((a, b) => a.score - b.score || a.finished - b.finished).slice(0, topCount);
        try { storage.setItem(localKey, JSON.stringify(records)); }
        catch { /* This session retains its ranking if storage is unavailable. */ }
      }
      return { score, best };
    },
  };
}

function parseClears(raw){

 return v;
}
function exchangeClears(storage,expected,backup,restore){
 if(expected===null||(restore&&backup===null)||storage.getItem(clearKey)!==expected||storage.getItem(backupKey)!==backup)throw Error("別の画面で記録が変わりました。");
 parseClears(expected);

 storage.setItem(backupKey,expected);

 return {next,raw};
}

  function recipeCard(recipe, available) {
    return `<button class="recipe-card" data-action="recipe" data-value="${recipe.id}" ${available ? "" : "disabled"}>
      <span class="food-icon ${recipe.color}" aria-hidden="true">${recipe.emoji}</span>
      <span class="recipe-details">
        <strong>${recipe.name}</strong>
        <span class="recipe-tags">${recipe.techniques.map((type) => `<span>${techniques[type].label}</span>`).join("")}</span>
      </span>
      <span class="card-foot">${clears[recipe.id] ? `<span class="stars" aria-label="${clears[recipe.id]}つ星">${"★".repeat(clears[recipe.id])}${"☆".repeat(3 - clears[recipe.id])}</span>` : `<span>${recipe.steps.length} 工程</span>`}${available ? icon("arrow", 16) : icon("lock", 14)}</span>
    </button>`;
  }

  function backButton(action, label, value = "") {
    return `<button class="back-link" data-action="${action}" data-value="${value}">${icon("back", 17)}${label}</button>`;
  }

  function ready() {
    const recipe = readyRecipe;
    return `<section class="page-panel">
      ${backButton("nav", "レシピ一覧へ", "menu")}
      <div class="ready-title"><span class="food-icon big ${recipe.color}" aria-hidden="true">${recipe.emoji}</span><div>
        <p class="eyebrow">第${recipe.chapter + 1}弾・${chapters[recipe.chapter].title}</p><h1>${recipe.name}</h1>
        <p>${recipe.steps.length} 工程 · ミス6回以内で完成を目指そう</p>
      </div></div>
      <h2 class="subheading">作り方</h2>
      <ol class="steps-list">${recipe.steps.map((step) => `<li><span>${techniques[step.type].icon}</span><div><b>${techniques[step.type].verb}</b><p>${step.direction}</p></div></li>`).join("")}</ol>
      <button class="primary" data-action="cook">調理スタート${icon("arrow")}</button>
    </section>`;
  }

  function lockedPage(type) {
    const timing = type === "time";
    return `<section class="page-panel locked-panel">
      <div class="feature-icon ${timing ? "gold" : "pink"}">${icon(timing ? "clock" : "trophy", 38)}</div>
      <h1>${timing ? "タイムアタック" : "ランキング"}</h1>
      <p>全75品をクリアすると解放されるよ。</p>
      <div class="unlock-progress"><span><b>${total()}</b> / 75 品</span><progress aria-label="タイムアタック解放までの進捗" value="${total()}" max="75"></progress></div>
      <button class="primary" data-action="recipe" data-value="${latestRecipe().id}">次の料理に挑戦${icon("arrow")}</button>
    </section>`;
  }

  function courseOptions(selected) {
    return `<option value="all" ${selected === "all" ? "selected" : ""}>全75品コース</option>` +
      chapters.map((group, index) => `<optgroup label="第${index + 1}弾・${group.title}">${recipes.filter((recipe) => recipe.chapter === index).map((recipe) => `<option value="${recipe.id}" ${selected === String(recipe.id) ? "selected" : ""}>${recipe.name}</option>`).join("")}</optgroup>`).join("");
  }

  function timePage() {
    if (!allUnlocked()) return lockedPage("time");
    const best = localScores[raceCourse];
    return `<section class="page-panel">
      <div class="feature-icon gold">${icon("clock", 35)}</div><h1>タイムアタック</h1>
      <p>料理を続けて作って、完成までの速さを競おう。ミス1回につき2秒加算されるよ。${standings.offline ? " 記録はこの端末で競えるよ。" : ""}</p>
      <form class="race-form" data-form="race">
        <label>コース<select data-field="course">${courseOptions(raceCourse)}</select></label>
        <label>ニックネーム<input name="nickname" maxlength="32" autocomplete="nickname" placeholder="ランキングに表示される名前" value="${escapeHtml(nickname)}" required></label>
        ${best ? `<p class="best-time">この${standings.offline ? "端末" : "ブラウザ"}のベスト <b>${formatTime(best)}</b></p>` : ""}
        ${raceNote ? `<p role="alert" class="error-text">${escapeHtml(raceNote)}</p>` : ""}
        <button class="primary" type="submit" ${starting ? "disabled" : ""}>${starting ? "準備中…" : "記録に挑戦"}${icon("arrow")}</button>
      </form>
    </section>`;
  }

  function ranking() {
    if (!allUnlocked()) return lockedPage("ranking");
    let content = '<p class="ranking-message">まだ記録がないよ。最初のタイムを登録しよう！</p>';
    if (rankState.loading) content = '<p class="ranking-message" role="status">ランキングを読み込み中…</p>';
    if (rankState.problem) content = '<p class="ranking-message">ランキングに接続できなかったよ。 <button class="text-button" data-action="refresh">再読み込み</button></p>';
    if (rankState.entries.length) content = `<div class="table-scroll"><table><thead><tr><th scope="col">順位</th><th scope="col">シェフ</th><th scope="col">ミス</th><th scope="col">記録</th></tr></thead><tbody>
      ${rankState.entries.map((row, index) => `<tr><td>${["🥇", "🥈", "🥉"][index] ?? index + 1}</td><td>${escapeHtml(row.name)}</td><td>${row.mistakes}回</td><td><strong>${formatTime(row.score)}</strong></td></tr>`).join("")}
    </tbody></table></div>`;
    return `<section class="page-panel">
      <div class="feature-icon pink">${icon("trophy", 35)}</div><h1>ランキング</h1>
      <p>${standings.offline ? "この端末に保存した記録の" : ""}上位20人が、ミスの加算を含むベストタイム順に並ぶよ。</p>
      <div class="ranking-select"><label>コース<select data-field="ranking">${courseOptions(rankCourse)}</select></label></div>
      ${content}
      <button class="secondary" data-action="nav" data-value="time">${icon("clock", 18)}タイムアタックへ</button>
    </section>`;
  }

  function gamePage() {
    const { game, ranked } = session;
    return `<section class="play-panel">
      ${backButton("leave", "中断する")}
      <div class="play-title"><div><p class="eyebrow" id="play-chapter"></p><h1 id="play-title">${game.recipe.name}</h1></div>
        <div class="game-timer">${icon("clock", 19)} <span id="play-timer">${ranked ? "00:00.00" : ""}</span></div>
      </div>
      <div id="step-track" class="step-track"></div>
      <div id="workbench"></div>
    </section>`;
  }

  function workbench(game) {
    const step = game.recipe.steps[game.step];
    const method = techniques[step.type];
    const heat = heatStep(step.type);
    const timer = !heat && !["mix", "cut"].includes(step.type);
    const meters = heat || timer;
    return `<section class="station station-${step.type}">
      <div class="station-head"><span>${method.icon} ${method.verb}</span><span id="mistakes"></span></div>
      <div class="station-scene" aria-hidden="true"><canvas class="art-3d" width="680" height="290" hidden></canvas><span class="scene-deco one">✦</span><span class="ingredient">${step.emoji}</span><span class="scene-deco two">✧</span></div>
      <div class="station-info"><h2>${step.direction}</h2><p>${method.tip}</p></div>
      ${meters ? `<div class="timing-wrap"><span>${heat ? "温度" : "タイミング"}</span><div class="timing-meter" id="timing-meter" aria-hidden="true"><span id="timing-range"></span><i id="timing-needle"></i></div></div>` : ""}
      <div class="task-progress"><progress id="task-meter" aria-label="工程の進み具合" value="0" max="${game.config.goal}"></progress><span id="task-count"></span></div>
      <p class="feedback" id="feedback" role="status"></p>
      <div class="game-controls">${heat ?
        ["弱火", "中火", "強火"].map((label, index) => `<button class="secondary heat-control" data-action="move" data-value="${index + 1}" aria-pressed="${index === 1}">${label}<small>${index + 1}</small></button>`).join("") :
        `<button class="primary cook-control" data-action="move" data-value="0">${method.button}<small>Space</small></button>`}
      </div>
    </section>`;
  }

  function updateGame() {
    if (screen !== "game" || !session) return;
    const { game, ranked } = session;
    if (game.done || game.failed) return;
    const stageKey = `${game.recipe.id}-${game.step}`;
    if (renderKey !== stageKey) {
      const restoreFocus = root.querySelector("#workbench")?.contains(document.activeElement);
      renderKey = stageKey;
      audio.setStation(game.type, game.power);
      root.querySelector("#play-title").textContent = game.recipe.name;
      root.querySelector("#play-chapter").textContent = ranked ?
        `タイムアタック · ${game.dish + 1} / ${game.course.length} 品` : `第${game.recipe.chapter + 1}弾 · ${chapters[game.recipe.chapter].title}`;
      root.querySelector("#step-track").innerHTML = game.recipe.steps.map((step, index) => `<span class="${index === game.step ? "current" : index < game.step ? "complete" : ""}" ${index === game.step ? 'aria-current="step"' : ""}>${index < game.step ? icon("check", 14) : index + 1}<b>${techniques[step.type].verb}</b></span>`).join("");
      root.querySelector("#workbench").innerHTML = workbench(game);
      if (restoreFocus) root.querySelector(".game-controls button")?.focus({ preventScroll: true });
    }
    const remaining = Math.ceil((game.dishDeadline - game.time) * TICK_MS / 1000);
    const timer = root.querySelector("#play-timer");
    const timeText = ranked ? formatTime(game.time * TICK_MS) : `あと ${remaining} 秒`;
    if (timer.textContent !== timeText) timer.textContent = timeText;
    const mistakes = root.querySelector("#mistakes");
    const mistakeText = `ミス ${game.dishMistakes} / 7`;
    if (mistakes.textContent !== mistakeText) mistakes.textContent = mistakeText;
    const count = root.querySelector("#task-count");
    const countText = `${game.count} / ${game.config.goal}`;
    if (count.textContent !== countText) {
      root.querySelector("#task-meter").value = game.count;
      count.textContent = countText;
    }
    const feedback = root.querySelector("#feedback");
    const feedbackText = game.lastMistake && game.time - game.lastMistake.time < 28 ? game.lastMistake.feedback : "";
    if (feedback.textContent !== feedbackText) feedback.textContent = feedbackText;
    const needle = root.querySelector("#timing-needle");
    if (needle) {
      const { config } = game;
      const heat = heatStep(game.type);
      const from = heat ? config.min : config.from / config.max * 100;
      const to = heat ? config.max : config.to / config.max * 100;
      const position = heat ? game.heat : (game.time - game.anchor) / config.max * 100;
      const range = root.querySelector("#timing-range");
      range.style.left = `${from}%`;
      range.style.width = `${to - from}%`;
      needle.style.left = `${position}%`;
      root.querySelector(".station-scene").classList.toggle("in-range", position >= from && position <= to);
      if (heat) for (const button of root.querySelectorAll(".heat-control")) {
        const pressed = String(Number(button.dataset.value) === game.power + 1);
        if (button.getAttribute("aria-pressed") !== pressed) button.setAttribute("aria-pressed", pressed);
      }
    }
    const scene = root.querySelector(".station-scene");
    const canvas=scene.querySelector(".art-3d"),now=performance.now();
    if(canvas.hidden||now-painted>=32){
      try{
        const reduced=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches??false;
        if(show3d(canvas,game.type,now,Math.max(0,1-(now-lastAction)/480),reduced)){
          canvas.hidden=false;scene.classList.add("visible-3d");painted=now;
        }
      }catch{canvas.hidden=true;scene.classList.remove("visible-3d");}
    }
    scene.classList.toggle("ingredient-hit", game.lastSuccess !== undefined && game.time - game.lastSuccess < 4);
  }

  function resultPage() {
    const { ranked, game, note, score, submitting, pending, newChapter, stars } = result;
    const passed = game.done;
    const dish = game.course.length === 1 ? game.course[0] : { name: "全75品コース", emoji: "🏆", color: "gold" };
    const next = passed && !ranked ? latestRecipe() : null;
    return `<section class="page-panel result-panel">
      <span class="food-icon big ${dish.color}">${passed ? dish.emoji : "🧤"}</span>
      <h1>${passed ? (ranked ? (game.course.length===recipes.length?"全75品タイムアタック完走！":"タイム更新に挑戦完了！") : "おいしくできました！") : "もう一度チャレンジ"}</h1>
      <p>${dish.name}${passed ? " 完成" : ""}</p>
      ${passed && !ranked ? `<div class="result-stars" aria-label="${stars}つ星">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>` : ""}
      ${passed && ranked ? `<div class="result-time"><strong>${formatTime(score)}</strong><span>調理 ${formatTime(game.time * TICK_MS)} ＋ ミス ${game.totalMistakes}回</span></div>` : ""}
      ${newChapter ? `<p class="unlock-note">${icon("spark", 17)} ${newChapter}</p>` : ""}
      ${note ? `<p class="result-note" role="status">${escapeHtml(note)}</p>` : ""}
      <div class="result-actions">
        ${!passed ? `<button class="primary" data-action="${ranked ? "nav" : "recipe"}" data-value="${ranked ? "time" : dish.id}">もう一度${icon("arrow")}</button>` : ""}
        ${next && !allUnlocked() ? `<button class="primary" data-action="recipe" data-value="${next.id}">次の料理へ${icon("arrow")}</button>` : ""}
        ${passed && allUnlocked() && (!ranked||game.course.length===recipes.length) ? '<button class="primary" data-action="nav" data-value="ending">エンディングを見る</button>' : ""}
        ${passed && ranked && pending && !submitting ? '<button class="primary" data-action="submit">記録を再送する</button>' : ""}
        ${passed && ranked && !submitting ? '<button class="secondary" data-action="nav" data-value="ranking">ランキングを見る</button>' : ""}
        <button class="secondary" data-action="nav" data-value="menu">レシピ一覧へ</button>
      </div>
    </section>`;
  }

  function navigate(target) {
    if (target === "ending" && !allUnlocked()) return;
    if (screen === "game" && !window.confirm("この料理を中断して移動する？")) return;
    cancelAnimationFrame(frame);
    audio.setStation(null);
    requestId += 1;
    starting = false;
    session = null;
    screen = target;
    if (target === "ranking" && allUnlocked()) {
      void fetchRanking(true);
      return;
    }
    if (target === "time") raceNote = "";
    render(true);
  }

  async function fetchRanking(focus = false) {
    const marker = ++requestId;
    rankState = { loading: true, entries: [], problem: false };
    render(focus);
    try {
      const entries = await standings.list(rankCourse);
      if (requestId !== marker || !mounted) return;
      rankState = { loading: false, entries, problem: false };
    } catch {
      if (requestId !== marker || !mounted) return;
      rankState = { loading: false, entries: [], problem: true };
    }
    render();
  }

  function start(course, token = null) {
    const ranked = Boolean(token);
    cancelAnimationFrame(frame);
    session = { game: createGame(course, ranked ? "ranked" : "practice"), ranked, token, actions: [], started: 0 };
    renderKey = "";
    lastAction=painted=-Infinity;
    screen = "game";
    render(true);
    session.started = performance.now();
    frame = requestAnimationFrame(tick);
  }

  function syncGame(now) {
    const { game, started } = session;
    const previousDishes = game.result.length;
    const previousMistake = game.lastMistake;
    advance(game, Math.floor((Math.max(now, started) - started) / TICK_MS));
    if (game.lastMistake !== previousMistake && !game.failed) audio.play("miss");
    if (game.result.length > previousDishes && !game.done) audio.play("done");
    if (game.done || game.failed) finish();
  }

  function tick(now) {
    if (screen !== "game" || !session) return;
    syncGame(now);
    if (screen !== "game") return;
    updateGame();
    frame = requestAnimationFrame(tick);
  }

  function move(action) {
    if (screen !== "game" || !session) return;
    audio.activate();
    syncGame(performance.now());
    if (screen !== "game") return;
    const { game, actions, ranked } = session;
    const stage = game.recipe.steps[game.step];
    const mistakes = game.totalMistakes;
    const previousDishes = game.result.length;
    if (!act(game, action)) return;
    lastAction=performance.now();
    if (ranked) actions.push([game.time, action]);
    audio.play(stage.type);
    if (heatStep(stage.type)) audio.setStation(stage.type, game.power);
    if (game.totalMistakes > mistakes) audio.play("miss");
    if (game.result.length > previousDishes && !game.done) audio.play("done");
    if (game.done || game.failed) finish();
    else updateGame();
  }

  function finish() {
    cancelAnimationFrame(frame);
    audio.setStation(null);
    const { game, ranked, token, actions } = session;
    result = { game, ranked, token, actions, note: game.failed ? (game.lastMistake?.feedback ?? "") : "" };
    if (game.done) {
      audio.play("done");
      if (ranked) {
        result.score = game.time * TICK_MS + game.totalMistakes * PENALTY_MS;
        if (!localScores[raceCourse] || result.score < localScores[raceCourse]) {
          localScores[raceCourse] = result.score;
          save("scores", localScores);
        }
        rankCourse = raceCourse;
        result.pending = true;
      } else {
        const recipe = game.recipe;
        const completedBefore = chapterClears(recipe.chapter);
        result.stars = game.result[0].stars;
        chapter = recipe.chapter;
        clears[recipe.id] = Math.max(clears[recipe.id] || 0, result.stars);
        if(!storeClears()) result.note=status;
        if (chapterClears(chapter) > completedBefore && chapterClears(chapter) === chapters[chapter].count) {
          if (chapter + 1 === chapters.length) result.newChapter = "全75品クリア！ タイムアタック解放";
          else {
            chapter += 1;
            result.newChapter = `第${chapter + 1}弾「${chapters[chapter].title}」解放！`;
          }
        }
      }
    }
    session = null;
    screen = "result";
    render(true);
    if (result.pending) void submitResult();
  }

  async function submitResult() {
    const current = result;
    if (current.submitting || !current.pending) return;
    current.submitting = true;
    current.note = standings.offline ? "記録を保存中…" : "ランキングに記録を送信中…";
    render();
    try {
      const data = await standings.finish({ device, token: current.token, actions: current.actions, ticks: current.game.time });
      current.pending = false;
      current.note = data.best ? "ランキングにベストタイムを登録したよ！" : "今回のタイムを計測したよ。ランキングにはこれまでのベストが残るよ。";
    } catch (error) {
      current.pending = !error.status || error.status >= 500;
      current.note = error.status ? error.message : "記録を送れなかったよ。接続を確認して再送してね。";
    }
    current.submitting = false;
    if (screen === "result" && result === current) render();
  }

  async function onSubmit(event) {
    if (event.target.dataset.form !== "race") return;
    event.preventDefault();
    if (starting || !allUnlocked()) return;
    nickname = new FormData(event.target).get("nickname").trim();
    if (!nickname || Array.from(nickname).length > 16) {
      raceNote = "ニックネームを1〜16文字で入力してね。";
      render();
      return;
    }
    audio.activate();
    save("nickname", nickname);
    const course = raceCourse;
    const marker = ++requestId;
    starting = true;
    raceNote = "";
    render();
    try {
      const data = await standings.start({ device, name: nickname, course });
      if (requestId !== marker || !mounted) return;
      starting = false;
      start(getCourse(course), data.token);
    } catch (error) {
      if (requestId !== marker || !mounted) return;
      starting = false;
      raceNote = error.status ? error.message : "ランキングに接続できなかったよ。";
      render();
    }
  }

  function onClick(event) {
    const button = event.target.closest("[data-action]");
    if (!button || button.disabled) return;
    const { action, value } = button.dataset;
    if (action === "audio") {
      audioOptions[value] = !audioOptions[value];
      audio.setPreferences(audioOptions);
      audio.activate();
      save("audio", audioOptions);
      button.setAttribute("aria-pressed", String(audioOptions[value]));
      return;
    }
    if (action !== "move") audio.activate();
    if (action === "nav") navigate(value);
    if(action==="reset"||action==="restore")switchRecord(action==="restore");
    if (action === "leave") navigate(session?.ranked ? "time" : "menu");
    if (action === "chapter") {
      chapter = Number(value);
      const top = window.scrollY;
      render();
      root.querySelector(`[data-action="chapter"][data-value="${chapter}"]`)?.focus({ preventScroll: true });
      window.scrollTo({ top, behavior: "instant" });
    }
    if (action === "recipe") {
      const recipe = recipes[Number(value) - 1];
      if (!recipe || !unlocked(recipe.chapter)) return;
      chapter = recipe.chapter;
      readyRecipe = recipe;
      screen = "ready";
      render(true);
    }
    if (action === "cook" && screen === "ready") {
      start([readyRecipe]);
    }
    if (action === "move") move(Number(value));
    if (action === "refresh") void fetchRanking();
    if (action === "submit") void submitResult();
  }

  function onChange(event) {
    const { field } = event.target.dataset;
    if (field === "course") {
      raceCourse = event.target.value;
      nickname = root.querySelector('[name="nickname"]').value;
      render();
      root.querySelector('[data-field="course"]').focus({ preventScroll: true });
    }
    if (field === "ranking") {
      rankCourse = event.target.value;
      void fetchRanking();
    }
  }

  function onKey(event) {
    if (screen !== "game" || !session || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    if (heatStep(session.game.type) && ["1", "2", "3"].includes(event.key)) {
      event.preventDefault();
      move(Number(event.key));
    }
    if (event.code === "Space" && !heatStep(session.game.type) && !event.target.closest?.("button, a, input, select")) {
      event.preventDefault();
      move(0);
    }
  }

  function onVisibility() {
    audio.setVisible(!document.hidden);
  }

  root.addEventListener("click", onClick);
  root.addEventListener("change", onChange);
  root.addEventListener("submit", onSubmit);
  document.addEventListener("keydown", onKey);
  document.addEventListener("visibilitychange", onVisibility);
  onVisibility();
  render();
  return () => {
    mounted = false;
    cancelAnimationFrame(frame);
    root.removeEventListener("click", onClick);
    root.removeEventListener("change", onChange);
    root.removeEventListener("submit", onSubmit);
    document.removeEventListener("keydown", onKey);
    document.removeEventListener("visibilitychange", onVisibility);
    audio.dispose();
  };
