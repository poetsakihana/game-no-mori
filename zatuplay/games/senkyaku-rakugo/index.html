<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千客万来 落語寄席</title><style>
:root{--red:#a33432;--ink:#302d29;--paper:#f4efdf;--gold:#c59c53}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:serif}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #bdb09a;border-radius:6px;padding:12px 20px;background:#fff9ed;color:var(--ink)}button:hover{background:#e9dcc3}button:disabled{opacity:.45;cursor:default}.primary{background:var(--red);color:white;border:0}header{padding:24px 5%;border-bottom:1px solid #cbbda4;display:flex;align-items:center;justify-content:space-between;gap:20px}header b{font-size:24px;letter-spacing:3px}small{color:#756c5c}nav{display:flex;gap:8px;padding:20px 5%;flex-wrap:wrap}nav button.active{background:var(--ink);color:white}main{max-width:1180px;margin:auto;padding:0 24px 50px}.intro{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;margin:14px 0}.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}.stage{height:360px;border:10px solid #573d31;background:repeating-linear-gradient(90deg,#7f282c 0 35px,#902f34 35px 70px);position:relative;overflow:hidden;display:grid;place-items:center;border-bottom-width:30px;box-shadow:0 12px 25px #45271822}.stage:before{content:'千客万来';position:absolute;top:16px;background:#efe3bc;color:#46382a;padding:8px 30px;letter-spacing:10px}.stage .actor{width:205px;position:absolute;bottom:5px}.nameboard{position:absolute;right:20px;bottom:15px;writing-mode:vertical-rl;background:#fff3cd;padding:15px 8px;font-size:23px;max-height:220px}.cushion{width:230px;height:32px;background:#7e4386;position:absolute;bottom:0;border-radius:50%;border:4px solid #d19cd4}.panel{background:#fffaf0;border:1px solid #d7cbb4;padding:24px;border-radius:8px}.label{color:var(--red);font-size:13px;letter-spacing:3px}.dialogue{min-height:112px;font-size:22px;line-height:1.8;padding:22px 0}progress{width:100%;accent-color:var(--red)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.card{text-align:center;background:#fffaf0;border:1px solid #d1c2a9;border-radius:7px;padding:14px}.card svg{height:120px;width:130px}.locked{filter:grayscale(1);opacity:.5}.tag{font-size:12px;background:#eee3ca;padding:4px 8px;border-radius:20px}.notice{background:#e9dfc7;padding:14px 18px;border-left:3px solid var(--gold);margin:18px 0;line-height:1.8}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#302d29;color:#fff;padding:15px 25px;border-radius:8px;z-index:10;display:none;max-width:90vw}select{padding:10px;max-width:100%;background:#fffcf5;border:1px solid #cbbda4}hr{border:0;border-top:1px solid #d7cbb4;margin:20px 0}.round{padding:16px;background:#eee4cd;margin:10px 0;line-height:1.9}footer{font-size:12px;color:#776b58;margin-top:25px} @media(max-width:760px){header{padding:18px;align-items:start}header b{font-size:18px}.layout{grid-template-columns:1fr}.stage{height:300px}h1{font-size:28px}main{padding:0 16px 35px}.intro{display:block}}

.stage-note{position:absolute;bottom:0;left:8px;font:11px sans-serif;color:#ffe8c9}.tone-strip{background:#ebe1ca;padding:14px;border-radius:7px;line-height:1.7}.tone-strip small{display:block}.reveal svg{display:block;width:190px;height:210px;margin:auto}.lantern{background:repeating-linear-gradient(0deg,#a33432 0 12px,#942728 13px 15px);color:#ffe9ad;border-radius:38%;width:100px;padding:35px 10px;margin:auto;font-size:25px;box-shadow:0 5px 0 #3e342f}.card h3{font-size:18px}.card p{margin:12px 0}.card button{padding:8px 12px}.locked{filter:grayscale(.75);opacity:.75}.actor .head{transform-origin:100px 123px}.actor .fan{transform-origin:125px 185px}.actor.speaking .head{animation:nod 1.1s infinite ease-in-out}.actor.speaking .mouth{animation:talk .3s infinite alternate}.actor.speaking .fan{animation:fan 1.8s infinite ease-in-out}.actor.brisk.speaking .head{animation-duration:.65s}.actor.theatrical.speaking .fan{animation-duration:.7s}.actor.paused *{animation-play-state:paused!important}.actor{transition:transform .3s}.actor.speaking{transform:rotate(var(--turn,0deg))}dialog{border:1px solid #c9b389;border-radius:12px;max-width:620px;width:92%;background:#fff9ec;color:#302d29;padding:25px;max-height:90vh}dialog::backdrop{background:#231a15aa}.detail-portrait svg{height:150px;width:140px}.close{float:right}a{color:#9e302d}input{padding:9px;max-width:100%;accent-color:#a33432}button:focus-visible,select:focus-visible{outline:3px solid #c59c53;outline-offset:3px}.panel .controls button{padding:12px 15px}@keyframes nod{50%{transform:rotate(3deg) translateY(2px)}}@keyframes talk{to{transform:translateY(2px);stroke-width:5px}}@keyframes fan{50%{transform:rotate(-13deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.listening{margin-top:24px;border-top:4px solid var(--gold)}.listening h2{margin-bottom:10px}.listen-hint{display:block;margin-top:14px;line-height:1.7}#listen-status{background:#eee4cd;padding:12px;border-radius:5px;margin:15px 0;font-weight:bold}.audience-reaction{min-height:25px;color:#a33432;font-size:14px;margin-top:8px}.story-length{font-size:14px;line-height:1.8;padding:10px 0;border-bottom:1px solid #d7cbb4}.story-section{margin-top:18px}.dialogue{min-height:130px}</style><header><div><small>噺を聴く。ご縁を集める。</small><br><b>千客万来 <span style="color:#a33432">落語寄席</span></b></div><div id="wallet"></div></header><nav id="nav"></nav><main id="app"></main><div id="toast" role="status"></div><script src="game.js"></script><script src="browser-port.js"></script></html>
