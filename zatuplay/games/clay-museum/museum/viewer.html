<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf6ed"><title>作品閲覧｜みぃ紙粘土美術館</title><link rel="stylesheet" href="viewer.css"></head>
<body><header class="work-heading"><div><small>みぃ紙粘土美術館 <span id="work-number"></span></small><h1 id="art-title">作品を読み込み中</h1></div><a id="direct-back" href="./?enter=1" hidden>会場へ戻る</a><span id="mode-badge">ORIGINAL</span></header><nav class="work-nav"><button id="prev-work">‹ 前の作品</button><button id="favorite">♡ お気に入り</button><button id="next-work">次の作品 ›</button></nav>
<main><div class="mode-switch" role="tablist" aria-label="作品の表示方法"><button id="tab-clay" role="tab" aria-selected="true" aria-controls="panel-clay" tabindex="0" data-mode="clay">作品写真</button><button id="tab-illustration" role="tab" aria-selected="false" aria-controls="panel-illustration" tabindex="-1" data-mode="illustration">イラスト</button><button id="tab-three" role="tab" aria-selected="false" aria-controls="panel-three" tabindex="-1" data-mode="three">立体鑑賞</button></div>
<div class="stage"><section id="panel-clay" role="tabpanel" aria-labelledby="tab-clay"><div class="image-pan" id="photo-surface"><img id="original-photo" alt="" draggable="false"></div></section><section id="panel-illustration" role="tabpanel" aria-labelledby="tab-illustration" hidden><div class="image-pan" id="illustration-surface"><div class="art-box"><div id="illustration-tile" role="img"><img id="illustration-atlas" alt="" draggable="false"></div></div></div></section><section id="panel-three" role="tabpanel" aria-labelledby="tab-three" hidden><div id="view"></div></section><p class="stage-label" id="stage-label">みぃさんの作品写真</p><p id="viewer-status" role="status" hidden></p></div>
<div id="image-controls" class="controls"><button id="image-minus" aria-label="画像を縮小">−</button><button id="image-fit">全体を見る</button><button id="image-plus" aria-label="画像を拡大">＋</button><span>ピンチで拡大・ドラッグで移動</span></div>
<div id="three-controls" class="controls" hidden><button id="auto" aria-pressed="true">自動回転 ON</button><button id="top">真上から</button><button id="reset">視点を戻す</button><button id="plus" aria-label="3Dを拡大">＋</button><button id="minus" aria-label="3Dを縮小">−</button><button id="wrap" aria-pressed="false">ラップを表示</button><button id="lighting">照明：自然光</button><button id="download">3Dモデル保存</button></div>
<footer><p id="mode-description">元の作品写真で、紙粘土の凹凸や色むらをそのままご覧いただけます。</p></footer></main><script type="module" src="viewer.js"></script><script type="module" src="viewer-extra.js"></script></body></html>
